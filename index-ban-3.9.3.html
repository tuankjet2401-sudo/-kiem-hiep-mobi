<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kiếm Thế Mobi – Bản 3.9.3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17351f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
#game{position:fixed;inset:0;overflow:hidden;background:#285b35}
canvas{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;z-index:20;top:max(10px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none}
.box{background:rgba(7,16,22,.93);border:1px solid #33404a;border-radius:18px;padding:12px 16px;color:#fff;box-shadow:0 8px 25px #0005}
#stats{width:430px;max-width:54vw}.name{font-size:25px;font-weight:800}.sub{font-size:17px}.bar{height:9px;border-radius:9px;background:#30363b;margin:6px 0;overflow:hidden}.hp{height:100%;background:#e45b56}.mp{height:100%;background:#63b7ee}
#town{width:250px;max-width:31vw;text-align:right;font-size:17px}
.btn{position:absolute;z-index:30;border:2px solid #68727d;background:#0d141bdf;color:#fff;border-radius:50%;width:68px;height:68px;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px #0005}
#bagBtn{right:24px;top:155px}.skills{position:absolute;z-index:30;right:18px;bottom:120px;display:flex;gap:10px}.skill{position:relative}
#joy{position:absolute;z-index:30;left:24px;bottom:125px;width:176px;height:176px;border-radius:50%;background:#14221bcc;border:4px solid #43504c}
#stick{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;background:#e8c45c;border:5px solid #fff0b0}
#msg{position:absolute;z-index:50;left:50%;top:42%;transform:translate(-50%,-50%);padding:10px 18px;border-radius:20px;background:#08100ddd;color:#fff;font-size:18px;display:none;white-space:nowrap}
.modal{position:absolute;z-index:80;inset:10% 4%;background:#101820f5;border:1px solid #3c4650;border-radius:24px;color:#fff;padding:20px;overflow:auto;display:none}
.modal h1{margin:0 0 12px;font-size:30px}.close{float:right;background:#303942;border:0;color:#fff;border-radius:12px;font-size:28px;padding:8px 14px}
.item{background:#20282f;border-radius:15px;padding:11px 13px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}.item strong{font-size:18px}.item small{display:block;color:#ddd}.rare{color:#c47cff}.good{color:#77e36a}.normal{color:#eee}
@media(max-width:430px){#stats{max-width:58vw;padding:10px 12px}.name{font-size:22px}.sub{font-size:15px}#town{max-width:34vw;font-size:15px}.skills{gap:8px;right:12px}.btn{width:64px;height:64px;font-size:28px}#joy{left:20px;bottom:110px;width:160px;height:160px}#stick{width:60px;height:60px}}
.action{background:#d2a44e;border:0;color:#fff;font-weight:700;border-radius:12px;padding:10px 13px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.slot{min-height:65px;background:#1c242b;border:1px solid #3b454e;border-radius:10px;padding:7px;font-size:12px}
@media(max-width:700px){#stats{max-width:55vw}.name{font-size:22px}#town{max-width:30vw}.modal{inset:8% 4%}.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>

<div class="hud">
  <div id="stats" class="box">
    <div class="name">⚔️ Thiếu Hiệp</div><div class="sub">Cấp <span id="lv">14</span> · Võ Đang</div>
    <div class="bar"><div id="hp" class="hp" style="width:82%"></div></div>
    <div class="bar"><div id="mp" class="mp" style="width:55%"></div></div>
    ❤️ <span id="hpText">180/220</span> · 💧 <span id="mpText">33/60</span> · ✨ <span id="expText">519/600</span><br>⚔️ <span id="atkText">15</span>
  </div>
  <div id="town" class="box">🏠 Tân Thủ Thôn<br>🌍 <span id="coord">1600,1500</span><br>🪙 <span id="gold">733</span></div>
</div>

<button id="bagBtn" class="btn">🎒</button>
<div id="joy"><div id="stick"></div></div>
<div class="skills">
  <button id="attack" class="btn skill">⚔️</button>
  <button id="skill" class="btn skill">☯️</button>
  <button id="fire" class="btn skill">🔥</button>
</div>
<div id="msg"></div>

<div id="bag" class="modal">
<button class="close" onclick="closeBag()">×</button>
<h1>🎒 Túi đồ & Trang bị</h1>
<h2>Trang bị</h2>
<div id="equip"></div>
<h2>🎒 Túi: <span id="count">0</span>/24</h2>
<div id="items"></div>
<h2>24 ô</h2><div id="grid" class="grid"></div>
</div>

<script>
"use strict";
const c=document.getElementById("c"),ctx=c.getContext("2d");
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;c.style.width=W+"px";c.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize);resize();

const world={w:3200,h:2400};
// BẢN 3.9.3: zoom-out để nhìn được nhiều WORLD hơn trên iPhone.
const ZOOM=0.72;
const P={x:1600,y:1500,r:25,hp:180,maxHp:220,mp:33,maxMp:60,atk:15,dead:false};
const cam={x:P.x,y:P.y};
const town={x:1600,y:1200};
const trees=[
[250,300],[600,420],[940,250],[1260,500],[1760,350],[2180,300],[2700,450],
[380,900],[800,850],[1150,760],[2050,800],[2500,850],[2950,950],
[260,1450],[720,1320],[1080,1550],[2150,1420],[2680,1510],[3000,1350],
[500,2050],[950,1900],[1450,2100],[2050,2000],[2500,2050],[2900,1900]
];
const mobs=[];
for(let i=0;i<12;i++)mobs.push({x:700+(i*211)%1900,y:650+(i*157)%1300,r:24,hp:65,maxHp:65,alive:true,hit:0});
const items=[
{name:"Kiếm Tân Thủ+",type:"vũ khí",rarity:"Thường",level:1,atk:5,def:0,icon:"🗡️"},
{name:"Đao Bào",type:"áo",rarity:"Thường",level:1,atk:0,def:5,icon:"🥋"},
{name:"Giáp Tinh Anh",type:"áo",rarity:"Tốt",level:2,atk:0,def:13,icon:"🛡️"},
{name:"Đao Tinh Anh",type:"vũ khí",rarity:"Hiếm",level:2,atk:18,def:0,icon:"⚔️"},
{name:"Đao Sơn Tặc",type:"vũ khí",rarity:"Thường",level:1,atk:9,def:0,icon:"🗡️"},
{name:"Bình Hồi Khí",type:"tiêu hao",rarity:"Thường",level:1,atk:0,def:0,icon:"🧪"}
];
let bag=[...items.slice(0,5),items[5],items[5]];
let equip={weapon:items[3],armor:items[2]};
const drops=[];
let gold=733,last=performance.now(),attackCd=0,skillCd=0,fireCd=0;

function rarityClass(r){return r==="Hiếm"?"rare":r==="Tốt"?"good":"normal"}
function openBag(){renderBag();document.getElementById("bag").style.display="block"}
function closeBag(){document.getElementById("bag").style.display="none"}
document.getElementById("bagBtn").onclick=openBag;

function renderBag(){
 document.getElementById("count").textContent=bag.length;
 document.getElementById("gold").textContent=gold;
 document.getElementById("equip").innerHTML=
 `<div class="item"><div>⚔️ <strong class="${rarityClass(equip.weapon.rarity)}">${equip.weapon.name}</strong><small>${equip.weapon.rarity} · ${equip.weapon.type} · Cấp ${equip.weapon.level} · ⚔️ ${equip.weapon.atk}</small></div><button class="action" onclick="unequip('weapon')">Tháo</button></div>
 <div class="item"><div>🛡️ <strong class="${rarityClass(equip.armor.rarity)}">${equip.armor.name}</strong><small>${equip.armor.rarity} · ${equip.armor.type} · Cấp ${equip.armor.level} · 🛡️ ${equip.armor.def}</small></div><button class="action" onclick="unequip('armor')">Tháo</button></div>`;
 document.getElementById("items").innerHTML=bag.map((it,i)=>
 `<div class="item"><div>${it.icon} <strong class="${rarityClass(it.rarity)}">${it.name}</strong><small>${it.rarity} · ${it.type} · Cấp ${it.level} · ⚔️ ${it.atk} 🛡️ ${it.def}</small></div>
 <div>${it.type==="tiêu hao"?'<button class="action" onclick="useItem('+i+')">Dùng</button>':'<button class="action" onclick="equipItem('+i+')">Trang bị</button>'} <button class="action" onclick="sellItem(${i})">Bán</button></div></div>`).join("");
 let g="";for(let i=0;i<24;i++)g+=`<div class="slot">${bag[i]?bag[i].icon+" "+bag[i].name:"—"}</div>`;
 document.getElementById("grid").innerHTML=g;
}
function equipItem(i){
 const it=bag[i]; if(!it)return;
 if(it.type==="vũ khí"){if(equip.weapon)bag.push(equip.weapon);equip.weapon=it}
 else if(it.type==="áo"){if(equip.armor)bag.push(equip.armor);equip.armor=it}
 bag.splice(i,1); clampBag(); renderBag()
}
function unequip(slot){if(bag.length>=24){toast("Túi đã đầy");return}bag.push(equip[slot]);equip[slot]=null;renderBag()}
function useItem(i){let it=bag[i];if(!it)return;if(it.name.includes("Hồi Khí")){P.mp=Math.min(P.maxMp,P.mp+30);bag.splice(i,1);toast("💧 Hồi 30 khí");renderBag()}}
function sellItem(i){gold+=20;bag.splice(i,1);renderBag();toast("🪙 +20 vàng")}
function clampBag(){if(bag.length>24)bag.length=24}
function toast(t){const m=document.getElementById("msg");m.textContent=t;m.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display="none",900)}

function spawnDrop(x,y){
 if(bag.length>=24){toast("🎒 Túi đầy");return}
 const r=Math.random();let it=r<.12?items[3]:r<.35?items[2]:items[Math.floor(Math.random()*5)];
 drops.push({x,y,item:it,born:performance.now(),kind:"item"});
 if(Math.random()<.3)drops.push({x:x+25,y:y+15,kind:"gold",amount:10+Math.floor(Math.random()*35),born:performance.now()});
}
function pickup(){
 for(let i=drops.length-1;i>=0;i--){
  const d=drops[i],dist=Math.hypot(P.x-d.x,P.y-d.y);
  if(dist<75){
   if(d.kind==="gold"){gold+=d.amount;toast("🪙 +"+d.amount);drops.splice(i,1)}
   else if(bag.length<24){bag.push(d.item);toast("🎁 "+d.item.name);drops.splice(i,1)}
   else toast("🎒 Túi đầy");
  }
 }
}
function nearest(){let best=null,bd=99999;for(const m of mobs)if(m.alive){let d=Math.hypot(P.x-m.x,P.y-m.y);if(d<bd){bd=d;best=m}}return best}
function damage(m,n){m.hp=Math.max(0,m.hp-n);m.hit=.15;if(m.hp<=0){m.alive=false;spawnDrop(m.x,m.y);document.getElementById("expText").textContent="600/600";toast("⚔️ Hạ Sơn Tặc · Có đồ rơi!")}}
function attack(){if(attackCd>0)return;attackCd=.45;let m=nearest();if(m&&Math.hypot(P.x-m.x,P.y-m.y)<150)damage(m,P.atk+equip.weapon.atk)}
function skillFn(){if(skillCd>0)return;skillCd=2;let m=nearest();if(m&&Math.hypot(P.x-m.x,P.y-m.y)<260)damage(m,35+equip.weapon.atk);toast("☯️ Võ công")}
function fireFn(){if(fireCd>0)return;fireCd=3;let m=nearest();if(m&&Math.hypot(P.x-m.x,P.y-m.y)<330)damage(m,55);toast("🔥 Hỏa công")}
document.getElementById("attack").addEventListener("touchstart",e=>{e.preventDefault();attack()},{passive:false});
document.getElementById("skill").addEventListener("touchstart",e=>{e.preventDefault();skillFn()},{passive:false});
document.getElementById("fire").addEventListener("touchstart",e=>{e.preventDefault();fireFn()},{passive:false});

const keys={};addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
let joy={x:0,y:0,active:false};
const joyEl=document.getElementById("joy"),stick=document.getElementById("stick");
function setJoy(e){const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,lim=r.width*.36;const d=Math.hypot(dx,dy);if(d>lim){dx*=lim/d;dy*=lim/d}joy.x=dx/lim;joy.y=dy/lim;stick.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`}
function endJoy(){joy.x=joy.y=0;joy.active=false;stick.style.transform="translate(-50%,-50%)"}
joyEl.addEventListener("touchstart",e=>{joy.active=true;setJoy(e.touches[0])},{passive:true});
joyEl.addEventListener("touchmove",e=>{if(joy.active)setJoy(e.touches[0])},{passive:true});
joyEl.addEventListener("touchend",endJoy,{passive:true});
c.addEventListener("touchstart",e=>{if(document.getElementById("bag").style.display==="block")return;pickup()},{passive:true});

function update(dt){
 let dx=joy.x,dy=joy.y;
 if(keys.w||keys.arrowup)dy-=1;if(keys.s||keys.arrowdown)dy+=1;if(keys.a||keys.arrowleft)dx-=1;if(keys.d||keys.arrowright)dx+=1;
 const len=Math.hypot(dx,dy)||1; if(dx||dy){P.x+=dx/len*230*dt;P.y+=dy/len*230*dt}
 P.x=Math.max(P.r,Math.min(world.w-P.r,P.x));P.y=Math.max(P.r,Math.min(world.h-P.r,P.y));
 for(const m of mobs)if(m.alive){
  const d=Math.hypot(P.x-m.x,P.y-m.y);
  if(d<330){m.x+=(P.x-m.x)/Math.max(d,1)*45*dt;m.y+=(P.y-m.y)/Math.max(d,1)*45*dt}
  if(d<55)m.hit=Math.max(m.hit,0.1);
  m.hit=Math.max(0,m.hit-dt);
 }
 attackCd=Math.max(0,attackCd-dt);skillCd=Math.max(0,skillCd-dt);fireCd=Math.max(0,fireCd-dt);
 // FIX 3.9.3: camera nhìn rộng hơn, có dead-zone và giới hạn theo WORLD.
 // P/cây/sông/thôn luôn dùng WORLD coordinates; camera chỉ thay đổi viewport.
 const viewW=W/ZOOM, viewH=H/ZOOM;
 const halfW=viewW/2, halfH=viewH/2;
 const deadX=Math.min(210,Math.max(150,viewW*0.34));
 const deadY=Math.min(170,Math.max(120,viewH*0.30));
 let targetCamX=cam.x, targetCamY=cam.y;
 if(P.x < cam.x-deadX) targetCamX=P.x+deadX;
 else if(P.x > cam.x+deadX) targetCamX=P.x-deadX;
 if(P.y < cam.y-deadY) targetCamY=P.y+deadY;
 else if(P.y > cam.y+deadY) targetCamY=P.y-deadY;
 const minCamX=halfW, maxCamX=Math.max(halfW,world.w-halfW);
 const minCamY=halfH, maxCamY=Math.max(halfH,world.h-halfH);
 targetCamX=Math.max(minCamX,Math.min(maxCamX,targetCamX));
 targetCamY=Math.max(minCamY,Math.min(maxCamY,targetCamY));
 cam.x += (targetCamX-cam.x)*Math.min(1,dt*7);
 cam.y += (targetCamY-cam.y)*Math.min(1,dt*7);
 pickup();
 document.getElementById("coord").textContent=Math.round(P.x)+","+Math.round(P.y);
 document.getElementById("hpText").textContent=Math.round(P.hp)+"/"+P.maxHp;
 document.getElementById("mpText").textContent=Math.round(P.mp)+"/"+P.maxMp;
 document.getElementById("hp").style.width=(P.hp/P.maxHp*100)+"%";
 document.getElementById("mp").style.width=(P.mp/P.maxMp*100)+"%";
 document.getElementById("gold").textContent=gold;
}

// World -> screen: every map object uses its fixed WORLD coordinate.
function sx(x){return x-cam.x+W/2}
function sy(y){return y-cam.y+H/2}
function draw(){
 ctx.clearRect(0,0,W,H);
 // WORLD nền
 ctx.fillStyle="#32683d";ctx.fillRect(0,0,W,H);
 ctx.save();ctx.translate(W/2,H/2);ctx.scale(ZOOM,ZOOM);ctx.translate(-cam.x,-cam.y);
 // grid cố định trong WORLD
 ctx.strokeStyle="#ffffff12";ctx.lineWidth=1;
 for(let x=0;x<=world.w;x+=160){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}
 for(let y=0;y<=world.h;y+=160){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}
 // sông cố định
 ctx.fillStyle="#3f91bd";ctx.beginPath();ctx.moveTo(0,1650);ctx.bezierCurveTo(500,1500,650,1900,1100,1750);ctx.bezierCurveTo(1450,1620,1800,1850,2200,1740);ctx.bezierCurveTo(2600,1640,2900,1800,3200,1700);ctx.lineTo(3200,2400);ctx.lineTo(0,2400);ctx.closePath();ctx.fill();
 // đường
 ctx.fillStyle="#b49a68";ctx.beginPath();ctx.moveTo(0,1850);ctx.quadraticCurveTo(800,1450,1600,1700);ctx.quadraticCurveTo(2300,1900,3200,1500);ctx.lineTo(3200,1750);ctx.quadraticCurveTo(2300,2150,1600,1950);ctx.quadraticCurveTo(800,1750,0,2100);ctx.closePath();ctx.fill();
 // thôn
 ctx.fillStyle="#765239";ctx.fillRect(town.x-140,town.y-100,280,200);
 ctx.fillStyle="#ffe48b";ctx.font="bold 40px sans-serif";ctx.textAlign="center";ctx.fillText("THÔN TÂN THỦ",town.x,town.y+12);
 // cây
 for(const [x,y] of trees){ctx.fillStyle="#704a30";ctx.fillRect(x-9,y+28,18,50);ctx.fillStyle="#285d37";ctx.beginPath();ctx.arc(x,y,58,0,Math.PI*2);ctx.fill();ctx.fillStyle="#347447";ctx.beginPath();ctx.arc(x-20,y-18,36,0,Math.PI*2);ctx.fill()}
 // NPC
 ctx.fillStyle="#78d28d";ctx.beginPath();ctx.arc(1780,1110,28,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font="18px sans-serif";ctx.fillText("💚 Đạo Sĩ",1780,1060);
 // mobs
 for(const m of mobs)if(m.alive){ctx.fillStyle=m.hit?"#ffbd59":"#814237";ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,Math.PI*2);ctx.fill();ctx.fillStyle="#ffe58a";ctx.beginPath();ctx.arc(m.x-8,m.y-4,5,0,Math.PI*2);ctx.arc(m.x+8,m.y-4,5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font="14px sans-serif";ctx.fillText("Sơn Tặc",m.x,m.y-34);ctx.fillStyle="#18221a";ctx.fillRect(m.x-30,m.y+30,60,6);ctx.fillStyle="#d95c5c";ctx.fillRect(m.x-30,m.y+30,60*(m.hp/m.maxHp),6)}
 // drops
 for(const d of drops){ctx.save();ctx.translate(d.x,d.y);ctx.shadowColor=d.kind==="gold"?"#ffd95a":"#aee8ff";ctx.shadowBlur=18;ctx.fillStyle=d.kind==="gold"?"#e8c64f":"#d7d7d7";ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#111";ctx.font="16px sans-serif";ctx.textAlign="center";ctx.fillText(d.kind==="gold"?"🪙":d.item.icon,0,6);ctx.fillStyle="#fff";ctx.fillText(d.kind==="gold"?"+"+d.amount:d.item.rarity.toUpperCase(),0,42);ctx.restore()}
 // player
 ctx.fillStyle="#f0d2b4";ctx.beginPath();ctx.arc(P.x,P.y-32,18,0,Math.PI*2);ctx.fill();ctx.fillStyle="#f5f1e4";ctx.beginPath();ctx.moveTo(P.x-24,P.y+45);ctx.lineTo(P.x,P.y-8);ctx.lineTo(P.x+28,P.y+45);ctx.lineTo(P.x,P.y+60);ctx.closePath();ctx.fill();ctx.strokeStyle="#e8e8e8";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(P.x+18,P.y+15);ctx.lineTo(P.x+55,P.y-38);ctx.stroke();
 ctx.restore();
}
function loop(t){let dt=Math.min(.035,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
renderBag();
</script>
</div>
</body>
</html>
