<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Đại Việt Chiến Ký">
<meta name="theme-color" content="#17110c">
<title>Đại Việt Chiến Ký — RPG 2.5D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17110c;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;z-index:5;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none}
.panel{background:#24170fe8;color:#ffe7ad;border:2px solid #b88943;border-radius:13px;box-shadow:0 5px 18px #0008;padding:7px 10px}
#stats{min-width:184px;font-size:12px}
#stats b{font-size:14px}
.bar{height:8px;width:132px;background:#301b1b;border:1px solid #000;border-radius:8px;overflow:hidden;margin:2px 0 3px}
#hp{height:100%;background:#d43d36}#mp{height:100%;background:#367fcb}
#buttons{display:flex;gap:5px;pointer-events:auto}
.ui{width:43px;height:43px;font-size:19px;border:2px solid #b88943;border-radius:10px;background:#352114e8;color:#ffe7ad}
#zone{position:fixed;z-index:5;top:calc(9px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#24170fe8;color:#ffe7ad;border:1.5px solid #b88943;border-radius:20px;padding:6px 13px;font-size:12px;pointer-events:none}
#joystick{position:fixed;z-index:7;left:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:126px;height:126px;border-radius:50%;background:#21170dcc;border:2px solid #b8894388}
#knob{position:absolute;left:34px;top:34px;width:54px;height:54px;border-radius:50%;background:#b8894399;border:2px solid #ffe6a2}
#combat{position:fixed;z-index:7;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;gap:7px;align-items:end}
.action{width:54px;height:54px;border-radius:50%;border:2px solid #b88943;background:#352114e8;color:#ffe7ad;font-size:20px}
#attack{width:70px;height:70px;background:#852c20e8;font-size:27px}
#quest{position:fixed;z-index:6;left:50%;bottom:calc(151px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:82vw;text-align:center;background:#21160de6;color:#ffe5a4;border:1px solid #9c763d;border-radius:18px;padding:7px 12px;font-size:11px;pointer-events:none}
.modal{display:none;position:fixed;z-index:20;inset:0;background:#0009;align-items:center;justify-content:center}
.modal.show{display:flex}
.box{width:min(92vw,430px);max-height:78vh;overflow:auto;background:#28190f;color:#ffe7ad;border:2px solid #b88943;border-radius:16px;padding:15px}
.box h2{text-align:center;margin:0 0 12px}.close{float:right;background:#6d281e;color:white;border:0;border-radius:7px;padding:5px 9px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.slot{aspect-ratio:1;background:#170e09;border:1px solid #76582f;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:23px}.slot small{font-size:9px;text-align:center}
#toast{display:none;position:fixed;z-index:30;left:50%;top:43%;transform:translate(-50%,-50%);background:#27170eea;color:#ffe8a9;border:2px solid #c4964b;border-radius:12px;padding:13px 18px;text-align:center;box-shadow:0 8px 25px #0008}
button:active{transform:scale(.94)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="zone">🏯 Thành Đại Việt</div>
<div id="top">
  <div id="stats" class="panel">
    <b>⚔️ ĐẠI VIỆT CHIẾN KÝ</b><br>
    Lv <span id="lv">1</span> · ❤️ <span id="hpText">120/120</span>
    <div class="bar"><div id="hp"></div></div>
    🔵 <span id="mpText">80/80</span>
    <div class="bar"><div id="mp"></div></div>
    💰 <span id="gold">900</span> · ⭐ <span id="exp">0</span>
  </div>
  <div id="buttons">
    <button class="ui" id="bag">🎒</button>
    <button class="ui" id="hero">🧑</button>
    <button class="ui" id="save">💾</button>
  </div>
</div>
<div id="joystick"><div id="knob"></div></div>
<div id="combat">
  <button class="action" id="fire">🔥</button>
  <button class="action" id="light">⚡</button>
  <button class="action" id="attack">⚔️</button>
</div>
<div id="quest">Nhiệm vụ: Hạ 3 Sơn Tặc · Tiến độ <span id="q">0/3</span></div>

<div class="modal" id="invModal"><div class="box"><button class="close" id="closeInv">✕</button><h2>🎒 Túi đồ 24 ô</h2><div class="grid" id="inventory"></div></div></div>
<div class="modal" id="heroModal"><div class="box"><button class="close" id="closeHero">✕</button><h2>🧑 Nhân vật</h2><p>⚔️ Công: <b id="statAtk">18</b></p><p>🛡️ Thủ: <b id="statDef">7</b></p><p>❤️ Sinh lực: <b id="statHp">120</b></p><p>🔵 Nội lực: <b id="statMp">80</b></p><p>⭐ Cấp: <b id="statLv">1</b></p><p>🗺️ Khu vực: <b id="statZone">Thành Đại Việt</b></p></div></div>
<div id="toast"></div>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",resize);resize();

const MAP={w:70,h:70,tile:42};
const player={x:35,y:36,z:0,level:1,hp:120,maxHp:120,mp:80,maxMp:80,atk:18,def:7,exp:0,gold:900};
const camera={x:0,y:0};
let questKills=0;
let particles=[];
let floating=[];
let mobs=[],npcs=[],items=[];

const names=["Sơn Tặc","Đạo Tặc","Sói Hoang","Hắc Y Nhân","Thổ Phỉ"];
for(let i=0;i<28;i++){
  let x=6+Math.random()*58,y=8+Math.random()*57;
  if(Math.abs(x-35)<10&&Math.abs(y-36)<10){x+=12}
  mobs.push({x,y,hp:55+Math.floor(Math.random()*30),maxHp:55+Math.floor(Math.random()*30),spd:.018+Math.random()*.012,dmg:5+Math.floor(Math.random()*5),name:names[i%names.length],alive:true,cd:0,hit:0});
}
npcs=[
 {x:32,y:31,name:"Lão Trương",icon:"🧓",color:"#f0c46c"},
 {x:39,y:31,name:"Chưởng Quầy",icon:"👨",color:"#f0c46c"},
 {x:35,y:40,name:"Thầy Thuốc",icon:"🧙",color:"#79d2ff"},
 {x:23,y:50,name:"Võ Sư",icon:"🥋",color:"#ff9a62"},
 {x:11,y:54,name:"Tiều Phu",icon:"🧔",color:"#d2a76d"}
];
const gates=[
 {x:35,y:8,name:"Bờ Sông",tx:35,ty:4},
 {x:8,y:36,name:"Rừng Trúc",tx:4,ty:54},
 {x:62,y:36,name:"Đồng Cỏ",tx:66,ty:36}
];
const inv=new Array(24).fill(null);
inv[0]={icon:"🗡️",name:"Kiếm Tân Binh",type:"atk",value:5};
inv[1]={icon:"🥋",name:"Áo Võ",type:"def",value:3};
inv[2]={icon:"🧪",name:"Bình Hồi Khí",type:"mp"};

const keys={};
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

let joy={active:false,id:null,x:0,y:0};
const joyEl=document.getElementById("joystick"),knob=document.getElementById("knob");
function joyMove(t){
 const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=t.clientX-cx,dy=t.clientY-cy,max=42,d=Math.hypot(dx,dy)||1;
 if(d>max){dx=dx/d*max;dy=dy/d*max}
 joy.x=dx/max;joy.y=dy/max;
 knob.style.left=34+dx+"px";knob.style.top=34+dy+"px";
}
joyEl.addEventListener("touchstart",e=>{e.preventDefault();let t=e.changedTouches[0];joy.active=true;joy.id=t.identifier;joyMove(t)},{passive:false});
joyEl.addEventListener("touchmove",e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===joy.id)joyMove(t)},{passive:false});
joyEl.addEventListener("touchend",e=>{for(const t of e.changedTouches)if(t.identifier===joy.id){joy.active=false;joy.x=joy.y=0;knob.style.left="34px";knob.style.top="34px"}});

function iso(wx,wy){
  return {x:(wx-wy)*MAP.tile/Math.sqrt(2),y:(wx+wy)*MAP.tile/2};
}
function screen(wx,wy){
 const p=iso(wx,wy);
 return {x:p.x-camera.x+W/2,y:p.y-camera.y+H/2};
}
function worldSize(){const a=iso(MAP.w,0),b=iso(0,MAP.h);return {w:Math.abs(a.x)+Math.abs(b.x),h:MAP.h*MAP.tile}}
function toast(t){const e=document.getElementById("toast");e.innerHTML=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",1700)}
function say(t){document.getElementById("quest").innerHTML=t;clearTimeout(say.t);say.t=setTimeout(()=>document.getElementById("quest").innerHTML='Nhiệm vụ: Hạ 3 Sơn Tặc · Tiến độ <span id="q">'+questKills+'/3</span>',2200)}
function addFloat(wx,wy,text){floating.push({x:wx,y:wy,text,life:55})}
function addParticle(wx,wy,type){for(let i=0;i<10;i++)particles.push({x:wx,y:wy,vx:(Math.random()-.5)*.08,vy:(Math.random()-.5)*.08,life:25,type})}

function tileType(x,y){
 if(x<13&&y>43)return"forest";
 if(x>51&&y>44)return"grass";
 if(x>22&&x<48&&y>21&&y<48)return"city";
 return"field";
}
function drawGround(){
 const range=38;
 for(let gy=Math.max(0,Math.floor(player.y-range));gy<Math.min(MAP.h,Math.ceil(player.y+range));gy++){
  for(let gx=Math.max(0,Math.floor(player.x-range));gx<Math.min(MAP.w,Math.ceil(player.x+range));gx++){
   const s=screen(gx,gy),s2=screen(gx+1,gy),s3=screen(gx+1,gy+1),s4=screen(gx,gy+1);
   let type=tileType(gx,gy);
   ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s2.x,s2.y);ctx.lineTo(s3.x,s3.y);ctx.lineTo(s4.x,s4.y);ctx.closePath();
   ctx.fillStyle=type==="forest"?"#416b3b":type==="city"?"#74714f":type==="grass"?"#6d9a50":"#829b57";ctx.fill();
   ctx.strokeStyle="#ffffff08";ctx.stroke();
  }
 }
 // roads
 road(35,0,35,70);road(0,36,70,36);
 // river
 river();
}
function road(x1,y1,x2,y2){
 ctx.save();ctx.strokeStyle="#b89968";ctx.lineWidth=MAP.tile*.8;ctx.lineCap="round";
 let a=screen(x1,y1),b=screen(x2,y2);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
 ctx.restore();
}
function river(){
 ctx.save();ctx.strokeStyle="#3d7792";ctx.lineWidth=MAP.tile*.95;ctx.lineCap="round";
 let a=screen(0,12),b=screen(70,7);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
 ctx.strokeStyle="#75aabd";ctx.lineWidth=3;
 for(let i=0;i<12;i++){let xx=5+i*6,yy=12-i*.07,s=screen(xx,yy);ctx.beginPath();ctx.moveTo(s.x-8,s.y);ctx.lineTo(s.x+8,s.y);ctx.stroke()}
 ctx.restore();
}
function drawCastle(){
 const sx=screen(29,24),sy=screen(41,24),back=screen(41,18),left=screen(29,18);
 ctx.fillStyle="#4d321f";poly([left,sx,sy,back],"#72583a");
 // main palace elevated
 const base=screen(35,25);
 drawBuilding(base.x,base.y,150,100,"#d0bd89","#62361f","ĐẠI VIỆT");
 // towers
 [[29,22],[41,22],[29,27],[41,27]].forEach(([x,y])=>{let p=screen(x,y);drawTower(p.x,p.y)});
}
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.closePath();ctx.fill()}
function drawBuilding(cx,cy,w,h,wall,roof,label){
 ctx.fillStyle="#0004";ctx.fillRect(cx-w/2+7,cy-h+9,w,h);
 ctx.fillStyle=wall;ctx.fillRect(cx-w/2,cy-h,w,h);
 ctx.fillStyle=roof;ctx.beginPath();ctx.moveTo(cx-w/2-18,cy-h);ctx.lineTo(cx,cy-h-42);ctx.lineTo(cx+w/2+18,cy-h);ctx.closePath();ctx.fill();
 ctx.fillStyle="#3a2519";ctx.fillRect(cx-18,cy-h+48,36,h-48);
 ctx.fillStyle="#ffe0a0";ctx.font="bold 16px Arial";ctx.textAlign="center";ctx.fillText(label,cx,cy-h-50);
}
function drawTower(cx,cy){
 ctx.fillStyle="#0004";ctx.fillRect(cx-28+5,cy-75+8,56,75);
 ctx.fillStyle="#c9b47f";ctx.fillRect(cx-28,cy-75,56,75);
 ctx.fillStyle="#62351f";ctx.beginPath();ctx.moveTo(cx-36,cy-75);ctx.lineTo(cx,cy-104);ctx.lineTo(cx+36,cy-75);ctx.closePath();ctx.fill();
}
function drawTrees(){
 for(let i=0;i<48;i++){
   let wx=4+(i*13)%61,wy=5+(i*17)%61;
   if(tileType(wx,wy)!=="forest")continue;
   let s=screen(wx,wy);drawTree(s.x,s.y);
 }
}
function drawTree(sx,sy){
 ctx.fillStyle="#0004";ctx.beginPath();ctx.ellipse(sx,sy+18,18,6,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#704829";ctx.fillRect(sx-4,sy-18,8,35);
 ctx.fillStyle="#294f31";ctx.beginPath();ctx.arc(sx,sy-35,25,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#4d813e";ctx.beginPath();ctx.arc(sx-14,sy-45,18,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#66974b";ctx.beginPath();ctx.arc(sx+13,sy-46,16,0,Math.PI*2);ctx.fill();
}
function drawHouses(){
 [[26,29,"Làng"],[44,29,"Quán"],[22,42,"Nhà"],[47,42,"Kho"]].forEach(([wx,wy,n])=>{
   let s=screen(wx,wy);drawBuilding(s.x,s.y,90,60,"#b98a50","#63351f",n);
 });
}
function drawNPCs(){
 npcs.forEach(n=>{
   let s=screen(n.x,n.y);
   ctx.fillStyle="#0005";ctx.beginPath();ctx.ellipse(s.x,s.y+13,17,6,0,0,Math.PI*2);ctx.fill();
   ctx.font="27px serif";ctx.textAlign="center";ctx.fillText(n.icon,s.x,s.y+5);
   ctx.fillStyle=n.color;ctx.font="11px Arial";ctx.fillText(n.name,s.x,s.y-20);
 });
}
function drawGates(){
 gates.forEach(g=>{
  let s=screen(g.x,g.y);ctx.fillStyle="#6b3d21";ctx.fillRect(s.x-20,s.y-30,40,30);ctx.fillStyle="#e0c77f";ctx.fillRect(s.x-14,s.y-24,28,24);
  ctx.fillStyle="#ffe6a4";ctx.font="10px Arial";ctx.textAlign="center";ctx.fillText("CỔNG",s.x,s.y-36);
 });
}
function drawMobs(){
 mobs.forEach(m=>{
  if(!m.alive)return;let s=screen(m.x,m.y);
  ctx.fillStyle="#0005";ctx.beginPath();ctx.ellipse(s.x,s.y+14,17,6,0,0,Math.PI*2);ctx.fill();
  ctx.font="27px serif";ctx.textAlign="center";ctx.fillText(m.name.includes("Sói")?"🐺":m.name.includes("Hắc")?"👹":"👺",s.x,s.y+6);
  ctx.fillStyle="#281313";ctx.fillRect(s.x-22,s.y-28,44,5);ctx.fillStyle="#d93832";ctx.fillRect(s.x-22,s.y-28,44*Math.max(0,m.hp/m.maxHp),5);
  if(m.hit){ctx.strokeStyle="#ffe4a1";ctx.lineWidth=3;ctx.beginPath();ctx.arc(s.x,s.y-3,27,0,Math.PI*2);ctx.stroke()}
 });
}
function drawPlayer(){
 let s=screen(player.x,player.y);
 ctx.fillStyle="#0006";ctx.beginPath();ctx.ellipse(s.x,s.y+18,20,7,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#1f4f79";ctx.beginPath();ctx.moveTo(s.x-13,s.y-3);ctx.lineTo(s.x+13,s.y-3);ctx.lineTo(s.x+17,s.y+17);ctx.lineTo(s.x-17,s.y+17);ctx.closePath();ctx.fill();
 ctx.fillStyle="#c83b31";ctx.fillRect(s.x-12,s.y-7,24,5);
 ctx.fillStyle="#e1a478";ctx.beginPath();ctx.arc(s.x,s.y-19,10,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#201712";ctx.beginPath();ctx.arc(s.x,s.y-23,11,Math.PI,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#eee";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(s.x+10,s.y+6);ctx.lineTo(s.x+30,s.y-16);ctx.stroke();
}
function drawEffects(){
 particles.forEach(pt=>{let s=screen(pt.x,pt.y);ctx.globalAlpha=Math.max(0,pt.life/25);ctx.fillStyle=pt.type==="fire"?"#ff8c31":"#8dd7ff";ctx.beginPath();ctx.arc(s.x,s.y,3,0,Math.PI*2);ctx.fill()});
 ctx.globalAlpha=1;
 floating.forEach(f=>{let s=screen(f.x,f.y);ctx.fillStyle="#ffe9a9";ctx.font="bold 13px Arial";ctx.textAlign="center";ctx.fillText(f.text,s.x,s.y-f.life*.35);});
}
function draw(){
 ctx.clearRect(0,0,W,H);
 // nền ngoài bản đồ
 ctx.fillStyle="#263e2b";ctx.fillRect(0,0,W,H);
 drawGround();drawCastle();drawHouses();drawTrees();drawGates();drawNPCs();drawMobs();drawPlayer();drawEffects();
}

function update(){
 let dx=0,dy=0;
 if(keys.a||keys.arrowleft)dx-=1;if(keys.d||keys.arrowright)dx+=1;if(keys.w||keys.arrowup)dy-=1;if(keys.s||keys.arrowdown)dy+=1;
 if(joy.active){dx=joy.x;dy=joy.y}
 let len=Math.hypot(dx,dy)||1;if(dx||dy){dx/=len;dy/=len;player.x+=dx*.11;player.y+=dy*.11}
 player.x=clamp(player.x,2,MAP.w-2);player.y=clamp(player.y,2,MAP.h-2);

 // Camera follows isometric player
 const pp=iso(player.x,player.y);camera.x+=(pp.x-camera.x)*.12;camera.y+=(pp.y-camera.y)*.12;

 mobs.forEach(m=>{
   if(!m.alive)return;
   let d=Math.hypot(m.x-player.x,m.y-player.y);
   if(d<7&&d>1){m.x+=(player.x-m.x)/d*m.spd;m.y+=(player.y-m.y)/d*m.spd}
   m.cd--;if(d<1.1&&m.cd<=0){let dmg=Math.max(1,m.dmg-player.def);player.hp-=dmg;m.cd=50;addFloat(player.x,player.y,"-"+dmg);if(player.hp<=0){player.hp=player.maxHp;player.mp=player.maxMp;player.x=35;player.y=36;toast("💀 Bạn đã bị hạ!<br>Hồi sinh tại Thành Đại Việt")}}
   if(m.hit)m.hit--;
 });
 particles.forEach(a=>{a.x+=a.vx;a.y+=a.vy;a.life--});particles=particles.filter(a=>a.life>0);
 floating.forEach(a=>{a.y-=.015;a.life--});floating=floating.filter(a=>a.life>0);
 if(player.mp<player.maxMp&&Math.random()<.012)player.mp++;
 hud();
}
function zone(){
 if(player.x<15&&player.y>43)return"🌳 Rừng Trúc";
 if(player.x>50&&player.y>43)return"🌾 Đồng Cỏ";
 if(player.y<16)return"🌊 Bờ Sông";
 if(player.x>21&&player.x<49&&player.y>20&&player.y<48)return"🏯 Thành Đại Việt";
 return"🏘️ Ngoại Thành";
}
function hud(){
 document.getElementById("lv").textContent=player.level;
 document.getElementById("hpText").textContent=Math.ceil(player.hp)+"/"+player.maxHp;
 document.getElementById("mpText").textContent=Math.ceil(player.mp)+"/"+player.maxMp;
 document.getElementById("gold").textContent=player.gold;
 document.getElementById("exp").textContent=player.exp;
 document.getElementById("hp").style.width=Math.max(0,player.hp/player.maxHp*100)+"%";
 document.getElementById("mp").style.width=Math.max(0,player.mp/player.maxMp*100)+"%";
 document.getElementById("zone").textContent=zone();
}

function nearest(range){
 let best=null,bd=range;
 mobs.forEach(m=>{if(!m.alive)return;let d=Math.hypot(m.x-player.x,m.y-player.y);if(d<bd){bd=d;best=m}});
 return best;
}
function hit(kind){
 let cost=kind===1?18:kind===2?24:0;
 if(player.mp<cost){say("🔵 Nội lực không đủ");return}
 let m=nearest(kind?5.2:3.2);if(!m){say("⚔️ Không có mục tiêu trong tầm");return}
 player.mp-=cost;
 let dmg=player.atk+(kind===1?30:kind===2?46:Math.floor(Math.random()*10));
 m.hp-=dmg;m.hit=8;addFloat(m.x,m.y,(kind===1?"🔥 ":"⚡ ")+dmg);addParticle(m.x,m.y,kind===1?"fire":"light");
 if(m.hp<=0){
   m.alive=false;let ex=12+Math.floor(Math.random()*13),g=8+Math.floor(Math.random()*14);
   player.exp+=ex;player.gold+=g;
   if(m.name==="Sơn Tặc")questKills++;
   addFloat(m.x,m.y,"+"+ex+" EXP");
   if(Math.random()<.58){let slot=inv.findIndex(v=>v===null);if(slot>=0)inv[slot]=Math.random()<.3?{icon:"🟣",name:"Trang Bị Hiếm",type:"atk",value:9}:{icon:"🧪",name:"Bình Hồi Khí",type:"mp"}}
   if(player.exp>=player.level*100){player.exp-=player.level*100;player.level++;player.maxHp+=28;player.maxMp+=14;player.atk+=5;player.def+=2;player.hp=player.maxHp;player.mp=player.maxMp;toast("🎉 LÊN CẤP "+player.level+"!")}
   setTimeout(()=>{m.x=5+Math.random()*60;m.y=8+Math.random()*58;m.hp=m.maxHp;m.alive=true},4500);
 }
 hud();
}
function interact(){
 for(const n of npcs)if(Math.hypot(n.x-player.x,n.y-player.y)<1.7){toast("💬 "+n.name+"<br>Chào hiệp khách!");return}
 for(const g of gates)if(Math.hypot(g.x-player.x,g.y-player.y)<1.8){player.x=g.tx;player.y=g.ty;toast("🚪 Đã tới "+g.name);return}
 say("Đến gần NPC hoặc cổng để tương tác");
}
canvas.addEventListener("touchend",interact,{passive:true});

function openInv(){
 const el=document.getElementById("inventory");el.innerHTML="";
 inv.forEach((it,i)=>{let s=document.createElement("div");s.className="slot";s.innerHTML=it?it.icon+"<small>"+it.name+"</small>":"<small>Trống</small>";s.onclick=()=>{if(!it)return;if(it.type==="mp"){player.mp=player.maxMp;inv[i]=null;say("🧪 Nội lực hồi đầy")}else if(it.type==="atk"){player.atk+=it.value;inv[i]=null;say("⚔️ Trang bị tăng công")}else if(it.type==="def"){player.def+=it.value;inv[i]=null;say("🛡️ Trang bị tăng thủ")}openInv();hud()};el.appendChild(s)});
 document.getElementById("invModal").classList.add("show");
}
function openHero(){
 statAtk.textContent=player.atk;statDef.textContent=player.def;statHp.textContent=player.maxHp;statMp.textContent=player.maxMp;statLv.textContent=player.level;statZone.textContent=zone();
 document.getElementById("heroModal").classList.add("show");
}
function closeAll(){document.querySelectorAll(".modal").forEach(m=>m.classList.remove("show"))}
function saveGame(){localStorage.setItem("daiviet_rpg_3d2d",JSON.stringify({player,inv,questKills}));toast("💾 Đã lưu game")}
function loadGame(){try{let d=JSON.parse(localStorage.getItem("daiviet_rpg_3d2d")||"null");if(d){Object.assign(player,d.player);for(let i=0;i<24;i++)inv[i]=d.inv?.[i]??null;questKills=d.questKills||0}}catch(e){}}

document.getElementById("bag").onclick=openInv;
document.getElementById("hero").onclick=openHero;
document.getElementById("save").onclick=saveGame;
document.getElementById("closeInv").onclick=closeAll;
document.getElementById("closeHero").onclick=closeAll;
document.getElementById("attack").onclick=()=>hit(0);
document.getElementById("fire").onclick=()=>hit(1);
document.getElementById("light").onclick=()=>hit(2);

loadGame();hud();setInterval(saveGame,20000);
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
