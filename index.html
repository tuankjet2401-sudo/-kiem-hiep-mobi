<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Đại Việt Chiến Ký</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07140e;font-family:Arial,sans-serif}
#game{position:relative;width:100vw;height:100vh;max-width:900px;margin:auto;overflow:hidden;background:#07140e}
#art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
button{border:1px solid #a87424;background:rgba(18,12,5,.86);color:#ffe5a0;border-radius:18px;font-weight:800;box-shadow:0 2px 8px #0008}
.hot{position:absolute;z-index:3}
#msg{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);z-index:10;padding:12px 22px;border-radius:16px;background:#111;color:#ffe5a0;border:1px solid #a87424;opacity:0;transition:.2s;pointer-events:none;font-size:16px;text-align:center;white-space:nowrap}
#msg.show{opacity:1}
#attack{right:5%;bottom:16%;width:86px;height:86px;border-radius:50%;font-size:38px;background:#7c281e}
#skill1{right:24%;bottom:17%;width:62px;height:62px;border-radius:50%;font-size:27px}
#skill2{right:15%;bottom:17%;width:62px;height:62px;border-radius:50%;font-size:27px}
#joy{left:6%;bottom:14%;width:125px;height:125px;border-radius:50%;font-size:32px}
.menu{bottom:2%;height:72px;padding:5px 10px;font-size:13px}
#m1{left:4%;width:17%}.m2{left:22%;width:17%}.m3{left:40%;width:17%}.m4{left:58%;width:17%}.m5{right:4%;width:17%}
.side{right:3%;width:76px;height:62px;font-size:12px}
#shop{top:14%}#bag{top:22%}#skill{top:30%}#quest{top:38%}#pet{top:46%}#spin{top:54%}#event{top:62%}
#mission{left:3%;top:19%;width:185px;height:92px;font-size:14px}
@media(max-width:500px){
.side{width:66px;height:58px;font-size:11px}
#joy{width:110px;height:110px}
#attack{width:78px;height:78px}
.menu{height:68px;font-size:11px}
#mission{width:170px}
}
</style>
</head>
<body>
<div id="game">
<img id="art" src="game-art.jpg" alt="Đại Việt Chiến Ký">
<button id="mission" class="hot">🎯 NHIỆM VỤ<br>Hạ 3 Sơn Tặc<br>Tiến độ <b id="progress">0/3</b></button>
<button id="shop" class="hot side">🧰<br>Tiệm</button>
<button id="bag" class="hot side">🎒<br>Túi Đồ</button>
<button id="skill" class="hot side">⚡<br>Kỹ Năng</button>
<button id="quest" class="hot side">📜<br>Nhiệm Vụ</button>
<button id="pet" class="hot side">🐕<br>Pet</button>
<button id="spin" class="hot side">🎡<br>Vòng Quay</button>
<button id="event" class="hot side">🎁<br>Sự Kiện</button>
<button id="joy" class="hot">✦</button>
<button id="skill1" class="hot">🔥</button>
<button id="skill2" class="hot">⚡</button>
<button id="attack" class="hot">⚔️</button>
<button id="m1" class="hot menu">👤<br>Nhân Vật</button>
<button id="m2" class="hot menu">🛡️<br>Trang Bị</button>
<button id="m3" class="hot menu">🚩<br>Bang Hội</button>
<button id="m4" class="hot menu">👥<br>Bạn Bè</button>
<button id="m5" class="hot menu">⚙️<br>Cài Đặt</button>
<div id="msg"></div>
</div>
<script>
const msg=document.getElementById('msg'),progress=document.getElementById('progress');
let kills=0;
function toast(t){msg.textContent=t;msg.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>msg.classList.remove('show'),1100)}
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
if(b.id==='attack'){kills=Math.min(3,kills+1);progress.textContent=kills+'/3';toast(kills===3?'🎉 Hoàn thành nhiệm vụ!':'⚔️ Đánh Sơn Tặc!')}
else if(b.id==='skill1')toast('🔥 Kỹ năng Hỏa Kích!')
else if(b.id==='skill2')toast('⚡ Kỹ năng Lôi Kích!')
else toast(b.innerText.replace(/\n/g,' · '))
}));
let sx=0,sy=0;
joy.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
joy.addEventListener('touchend',e=>{const x=e.changedTouches[0].clientX-sx,y=e.changedTouches[0].clientY-sy;if(Math.abs(x)+Math.abs(y)>25)toast(x>20?'➡️ Di chuyển phải':x<-20?'⬅️ Di chuyển trái':y>20?'⬇️ Di chuyển xuống':'⬆️ Di chuyển lên')},{passive:true});
</script>
</body>
</html>
