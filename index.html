<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Đại Việt Chiến Ký</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#06130d;
  font-family:Arial,sans-serif;-webkit-text-size-adjust:100%;
}
body{display:flex;justify-content:center}
#game{
  position:relative;width:100vw;height:100dvh;max-width:720px;
  overflow:hidden;background:#06130d;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
#art{
  position:absolute;left:0;top:0;width:100%;height:100%;
  object-fit:cover;object-position:center center;display:block;
}
button{
  border:2px solid #a87424;background:rgba(18,12,5,.88);
  color:#ffe5a0;border-radius:18px;font-weight:800;
  box-shadow:0 2px 8px #0009;
  font-family:Arial,sans-serif;
}
.hot{position:absolute;z-index:3}
#mission{
  left:3%;top:19%;width:31%;min-height:88px;padding:10px;
  font-size:clamp(12px,2.2vw,16px);line-height:1.35;
}
.side{
  right:3%;width:13%;min-width:64px;height:7%;
  font-size:clamp(10px,1.8vw,14px);line-height:1.25;
}
#shop{top:14%}#bag{top:22%}#skill{top:30%}#quest{top:38%}
#pet{top:46%}#spin{top:54%}#event{top:62%}

#joy{
  left:6%;bottom:15%;width:25vw;height:25vw;max-width:135px;max-height:135px;
  border-radius:50%;font-size:30px;
}
#skill1,#skill2{
  bottom:17%;width:65px;height:65px;border-radius:50%;font-size:28px;
}
#skill1{right:23%}#skill2{right:14%}
#attack{
  right:3%;bottom:15%;width:88px;height:88px;border-radius:50%;
  font-size:38px;background:#7c281e;
}
.menu{
  bottom:2.5%;height:8%;min-height:58px;padding:4px 2px;
  font-size:clamp(10px,1.8vw,14px);line-height:1.25;
}
#m1{left:3%;width:18%}
#m2{left:22%;width:18%}
#m3{left:41%;width:18%}
#m4{left:60%;width:18%}
#m5{right:3%;width:18%}

#msg{
  position:absolute;left:50%;bottom:28%;transform:translateX(-50%);
  z-index:10;padding:10px 18px;border-radius:16px;
  background:#111d;color:#ffe5a0;border:1px solid #a87424;
  opacity:0;transition:.2s;pointer-events:none;font-size:15px;
  text-align:center;white-space:nowrap;
}
#msg.show{opacity:1}

@media(max-width:430px){
  #mission{width:34%;top:20%;font-size:12px}
  .side{width:15%;right:2%;min-width:62px}
  #joy{left:5%;bottom:17%;width:118px;height:118px}
  #attack{width:76px;height:76px;bottom:17%;font-size:32px}
  #skill1,#skill2{width:58px;height:58px;bottom:18%;font-size:24px}
  #skill1{right:23%}#skill2{right:14%}
  .menu{height:8.5%;bottom:2%;font-size:10px}
}
</style>
</head>
<body>
<div id="game">
<img id="art" src="game-art.jpg" alt="Đại Việt Chiến Ký">

<button id="mission" class="hot">🎯 NHIỆM VỤ<br>Hạ 3 Sơn Tặc<br>Tiến độ <b id="progress">0/3</b></button>
<button id="shop" class="hot side">🧰<br>Tiệm</button>
<button id="bag" class="hot side">🎒<br>Túi Đồ</button>
<button id="skill" class="hot side">⚡<br>Kỹ Năng</button>
<button id="quest" class="hot side">📜<br>Nhiệm Vụ</button>
<button id="pet" class="hot side">🐕<br>Pet</button>
<button id="spin" class="hot side">🎡<br>Vòng Quay</button>
<button id="event" class="hot side">🎁<br>Sự Kiện</button>

<button id="joy" class="hot">✦</button>
<button id="skill1" class="hot">🔥</button>
<button id="skill2" class="hot">⚡</button>
<button id="attack" class="hot">⚔️</button>

<button id="m1" class="hot menu">👤<br>Nhân Vật</button>
<button id="m2" class="hot menu">🛡️<br>Trang Bị</button>
<button id="m3" class="hot menu">🚩<br>Bang Hội</button>
<button id="m4" class="hot menu">👥<br>Bạn Bè</button>
<button id="m5" class="hot menu">⚙️<br>Cài Đặt</button>

<div id="msg"></div>
</div>

<script>
const msg=document.getElementById('msg');
const progress=document.getElementById('progress');
let kills=0;
function toast(t){
 msg.textContent=t;msg.classList.add('show');
 clearTimeout(window.tt);
 window.tt=setTimeout(()=>msg.classList.remove('show'),1100);
}
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
 if(b.id==='attack'){
   kills=Math.min(3,kills+1);
   progress.textContent=kills+'/3';
   toast(kills===3?'🎉 Hoàn thành nhiệm vụ!':'⚔️ Đánh Sơn Tặc!');
 }else if(b.id==='skill1')toast('🔥 Kỹ năng Hỏa Kích!');
 else if(b.id==='skill2')toast('⚡ Kỹ năng Lôi Kích!');
 else toast(b.innerText.replace(/\n/g,' · '));
}));
let sx=0,sy=0;
const joy=document.getElementById('joy');
joy.addEventListener('touchstart',e=>{
 sx=e.touches[0].clientX;sy=e.touches[0].clientY;
},{passive:true});
joy.addEventListener('touchend',e=>{
 const x=e.changedTouches[0].clientX-sx,y=e.changedTouches[0].clientY-sy;
 if(Math.abs(x)+Math.abs(y)>25)
 toast(x>20?'➡️ Di chuyển phải':x<-20?'⬅️ Di chuyển trái':y>20?'⬇️ Di chuyển xuống':'⬆️ Di chuyển lên');
},{passive:true});
</script>
</body>
</html>
