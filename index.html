<!DOCTYPE html>

<html lang="vi">

<head>

<meta charset="utf-8">

<meta name="viewport"

      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Kiếm Thế Mobi - Bản 3.1</title>

<style>

*{

  box-sizing:border-box;

  -webkit-tap-highlight-color:transparent;

  user-select:none;

  -webkit-user-select:none;

}

html,body{

  margin:0;

  width:100%;

  height:100%;

  overflow:hidden;

  background:#071b12;

  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

}

#game{

  position:fixed;

  inset:0;

  overflow:hidden;

  background:#183f29;

}

canvas{

  display:block;

  width:100%;

  height:100%;

}

.hud{

  position:absolute;

  top:max(14px,env(safe-area-inset-top));

  left:14px;

  right:14px;

  z-index:20;

  display:flex;

  justify-content:space-between;

  pointer-events:none;

}

.box{

  min-width:145px;

  max-width:44vw;

  padding:10px 12px;

  border:1px solid rgba(255,255,255,.16);

  border-radius:14px;

  background:rgba(5,13,15,.88);

  color:#fff;

  box-shadow:0 8px 25px rgba(0,0,0,.25);

}

.name{

  font-size:20px;

  font-weight:800;

}

.small{

  font-size:14px;

  margin-top:2px;

}

.stat{

  margin-top:7px;

  font-size:14px;

  white-space:nowrap;

}

.bar{

  width:145px;

  max-width:100%;

  height:7px;

  margin-top:5px;

  border-radius:10px;

  background:#333;

  overflow:hidden;

}

.hp{

  height:100%;

  background:#e34f4f;

}

.mp{

  height:100%;

  background:#55aef2;

}

.btn{

  position:absolute;

  z-index:40;

  width:70px;

  height:70px;

  border-radius:50%;

  border:1px solid rgba(255,255,255,.2);

  background:rgba(5,12,15,.9);

  color:white;

  font-size:30px;

  display:flex;

  align-items:center;

  justify-content:center;

  box-shadow:0 7px 18px rgba(0,0,0,.25);

}

.btn:active{

  transform:scale(.92);

}

#bagBtn{

  right:18px;

  bottom:105px;

}

#questBtn{

  right:98px;

  bottom:105px;

}

#skillBtn{

  right:178px;

  bottom:105px;

}

#attackBtn{

  right:258px;

  bottom:105px;

}

@media(max-width:500px){

  #attackBtn{right:260px}

  #skillBtn{right:180px}

  #questBtn{right:100px}

  #bagBtn{right:20px}

}

.joystick{

  position:absolute;

  z-index:40;

  left:36px;

  bottom:75px;

  width:180px;

  height:180px;

  border:3px solid rgba(255,255,255,.22);

  border-radius:50%;

  background:rgba(0,0,0,.12);

}

.joystick:after{

  content:"";

  position:absolute;

  inset:44px;

  border:2px solid rgba(255,255,255,.12);

  border-radius:50%;

}

.stick{

  position:absolute;

  left:50%;

  top:50%;

  width:82px;

  height:82px;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:#e0b448;

  border:5px solid #f7d36c;

  box-shadow:0 5px 15px rgba(0,0,0,.25);

}

.help{

  position:absolute;

  z-index:15;

  left:50%;

  bottom:18px;

  transform:translateX(-50%);

  color:rgba(255,255,255,.7);

  font-size:15px;

  white-space:nowrap;

  pointer-events:none;

}

#message{

  position:absolute;

  z-index:80;

  top:50%;

  left:50%;

  transform:translate(-50%,-50%);

  width:min(88vw,500px);

  padding:14px 18px;

  border-radius:15px;

  background:rgba(5,12,15,.94);

  border:1px solid #c99b42;

  color:#ffe59a;

  text-align:center;

  font-size:18px;

  font-weight:700;

  display:none;

  pointer-events:none;

}

#target{

  position:absolute;

  z-index:35;

  left:50%;

  bottom:245px;

  transform:translateX(-50%);

  padding:7px 16px;

  border-radius:18px;

  background:rgba(0,0,0,.65);

  color:#fff;

  font-size:14px;

  display:none;

  pointer-events:none;

}

.modal{

  position:absolute;

  z-index:100;

  inset:0;

  background:rgba(0,0,0,.62);

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

}

.panel{

  width:min(92vw,470px);

  max-height:82vh;

  overflow:auto;

  background:#f4f0df;

  color:#241e16;

  border-radius:18px;

  padding:16px;

  box-shadow:0 20px 60px rgba(0,0,0,.45);

}

.panel h2{

  margin:0 0 10px;

  color:#7b4b19;

}

.panel p{

  margin:7px 0;

}

.close{

  float:right;

  border:0;

  border-radius:10px;

  padding:7px 12px;

  background:#8d3228;

  color:white;

  font-weight:bold;

}

.item{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:10px;

  margin:7px 0;

  border-radius:10px;

  background:#e8dfc7;

}

.item button{

  border:0;

  border-radius:8px;

  padding:7px 10px;

  background:#6d471c;

  color:white;

}

.quest{

  padding:10px;

  margin:7px 0;

  border-radius:10px;

  background:#e8dfc7;

}

.quest button{

  margin-top:6px;

  border:0;

  border-radius:8px;

  padding:8px 12px;

  background:#477333;

  color:white;

}

#toast{

  position:absolute;

  z-index:150;

  left:50%;

  top:30%;

  transform:translateX(-50%);

  padding:10px 16px;

  border-radius:12px;

  background:rgba(0,0,0,.82);

  color:white;

  font-size:15px;

  display:none;

  pointer-events:none;

}

</style>

</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div class="hud">

  <div class="box">

    <div class="name">⚔️ Thiếu Hiệp</div>

    <div class="small" id="levelText">Cấp 8 · Võ Đang</div>

    <div class="bar">

      <div class="hp" id="hpBar" style="width:100%"></div>

    </div>

    <div class="bar">

      <div class="mp" id="mpBar" style="width:0%"></div>

    </div>

    <div class="stat">

      ❤️ <span id="hpText">100/100</span>

      · ✨ <span id="expText">0/100</span>

    </div>

  </div>

  <div class="box" style="text-align:right">

    <div id="areaText">🗺️ Làng Tân Thủ</div>

    <div class="small">📍 <span id="coordText">1600,1200</span></div>

    <div class="stat">🪙 <span id="goldText">0</span></div>

  </div>

</div>

<div id="target">👹 Sơn Tặc · 60/60</div>

<div class="joystick" id="joystick">

  <div class="stick" id="stick"></div>

</div>

<button class="btn" id="attackBtn">⚔️</button>

<button class="btn" id="skillBtn">☯️</button>

<button class="btn" id="questBtn">📜</button>

<button class="btn" id="bagBtn">🎒</button>

<div class="help">Kéo joystick để di chuyển</div>

<div id="message"></div>

<div id="toast"></div>

<!-- TÚI ĐỒ -->

<div class="modal" id="bagModal">

  <div class="panel">

    <button class="close" onclick="closeModal('bagModal')">Đóng</button>

    <h2>🎒 Túi đồ</h2>

    <div id="inventory"></div>

  </div>

</div>

<!-- NHIỆM VỤ -->

<div class="modal" id="questModal">

  <div class="panel">

    <button class="close" onclick="closeModal('questModal')">Đóng</button>

    <h2>📜 Nhiệm vụ</h2>

    <div id="quests"></div>

  </div>

</div>

<!-- NPC -->

<div class="modal" id="npcModal">

  <div class="panel">

    <button class="close" onclick="closeModal('npcModal')">Đóng</button>

    <h2 id="npcTitle">🧑 NPC</h2>

    <div id="npcContent"></div>

  </div>

</div>

<!-- TRANG BỊ -->

<div class="modal" id="equipModal">

  <div class="panel">

    <button class="close" onclick="closeModal('equipModal')">Đóng</button>

    <h2>⚔️ Trang bị</h2>

    <div id="equipment"></div>

  </div>

</div>

</div>

<script>

"use strict";

/* =========================================================

   KIẾM THẾ MOBI - BẢN 3.1

   ========================================================= */

const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d");

let W = innerWidth;

let H = innerHeight;

function resize(){

  W = innerWidth;

  H = innerHeight;

  const dpr = Math.min(devicePixelRatio || 1,2);

  canvas.width = W*dpr;

  canvas.height = H*dpr;

  canvas.style.width = W+"px";

  canvas.style.height = H+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);

}

addEventListener("resize",resize);

resize();

/* =========================

   DỮ LIỆU NGƯỜI CHƠI

========================= */

const player = {

  x:1600,

  y:1200,

  level:8,

  exp:0,

  maxExp:100,

  hp:100,

  maxHp:100,

  mp:0,

  maxMp:100,

  gold:0,

  attack:18,

  defense:5,

  attackCD:0,

  skillCD:0,

  direction:0,

  inventory:[

    {id:"potion",name:"❤️ Tiểu Hoàn Đan",count:3},

    {id:"iron",name:"⛓️ Thiết Khoáng",count:0}

  ],

  equipment:{

    weapon:null,

    armor:null

  }

};

let currentArea = "village";

const areas = {

  village:{

    name:"Làng Tân Thủ",

    color:"#244f31",

    spawn:{x:1600,y:1200},

    minX:0,

    maxX:3200,

    minY:0,

    maxY:2400

  },

  forest:{

    name:"🌲 Rừng Sơn Tặc",

    color:"#183d29",

    spawn:{x:1600,y:1200},

    minX:0,

    maxX:3600,

    minY:0,

    maxY:2800

  },

  wudang:{

    name:"⛰️ Núi Võ Đang",

    color:"#253e48",

    spawn:{x:1600,y:1200},

    minX:0,

    maxX:4000,

    minY:0,

    maxY:3000

  }

};

/* =========================

   NPC

========================= */

const npcs = [

  {

    id:"elder",

    name:"Trưởng Làng",

    icon:"🧓",

    x:1600,

    y:1050,

    area:"village"

  },

  {

    id:"blacksmith",

    name:"Thợ Rèn",

    icon:"🔨",

    x:1900,

    y:1100,

    area:"village"

  },

  {

    id:"merchant",

    name:"Tiểu Thương",

    icon:"🧑‍💼",

    x:1300,

    y:1050,

    area:"village"

  },

  {

    id:"master",

    name:"Đệ Tử Võ Đang",

    icon:"🧙",

    x:1900,

    y:1250,

    area:"wudang"

  }

];

/* =========================

   QUÁI

========================= */

let monsters = [];

function spawnMonsters(){

  monsters=[];

  let count =

    currentArea==="village" ? 5 :

    currentArea==="forest" ? 10 :

    8;

  for(let i=0;i<count;i++){

    const m = {

      id:Date.now()+i+Math.random(),

      type:currentArea==="wudang" ? "Đạo Tặc" : "Sơn Tặc",

      x:700+Math.random()*2200,

      y:600+Math.random()*1500,

      hp:60,

      maxHp:60,

      attack:7,

      speed:0.45,

      alive:true,

      hitFlash:0,

      attackTimer:0,

      respawn:0

    };

    monsters.push(m);

  }

}

spawnMonsters();

/* =========================

   VẬT PHẨM

========================= */

const items = {

  sword:{

    id:"sword",

    name:"⚔️ Kiếm Tân Thủ",

    type:"weapon",

    attack:8

  },

  armor:{

    id:"armor",

    name:"🛡️ Giáp Võ Đang",

    type:"armor",

    defense:8

  },

  iron:{

    id:"iron",

    name:"⛓️ Thiết Khoáng",

    type:"material"

  },

  potion:{

    id:"potion",

    name:"❤️ Tiểu Hoàn Đan",

    type:"potion"

  }

};

/* =========================

   NHIỆM VỤ

========================= */

const quests = {

  q1:{

    id:"q1",

    title:"Dẹp loạn Sơn Tặc",

    desc:"Đánh bại 5 Sơn Tặc.",

    need:5,

    progress:0,

    rewardExp:80,

    rewardGold:100,

    done:false,

    claimed:false

  },

  q2:{

    id:"q2",

    title:"Thu thập Thiết Khoáng",

    desc:"Thu thập 3 Thiết Khoáng.",

    need:3,

    progress:0,

    rewardExp:100,

    rewardGold:150,

    done:false,

    claimed:false

  },

  q3:{

    id:"q3",

    title:"Đến Núi Võ Đang",

    desc:"Đặt chân đến Núi Võ Đang.",

    need:1,

    progress:0,

    rewardExp:120,

    rewardGold:200,

    done:false,

    claimed:false

  }

};

/* =========================

   CAMERA

========================= */

let camera = {

  x:0,

  y:0

};

function updateCamera(){

  camera.x = player.x - W/2;

  camera.y = player.y - H/2;

  const a=areas[currentArea];

  camera.x=Math.max(0,Math.min(camera.x,a.maxX-W));

  camera.y=Math.max(0,Math.min(camera.y,a.maxY-H));

}

/* =========================

   JOYSTICK

========================= */

const joystick=document.getElementById("joystick");

const stick=document.getElementById("stick");

let joy={

  active:false,

  x:0,

  y:0

};

function joystickMove(clientX,clientY){

  const r=joystick.getBoundingClientRect();

  let dx=clientX-(r.left+r.width/2);

  let dy=clientY-(r.top+r.height/2);

  const max=65;

  const len=Math.hypot(dx,dy);

  if(len>max){

    dx=dx/len*max;

    dy=dy/len*max;

  }

  joy.x=dx/max;

  joy.y=dy/max;

  stick.style.transform=

    `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;

}

function joystickEnd(){

  joy.active=false;

  joy.x=0;

  joy.y=0;

  stick.style.transform="translate(-50%,-50%)";

}

joystick.addEventListener("touchstart",e=>{

  e.preventDefault();

  joy.active=true;

  const t=e.touches[0];

  joystickMove(t.clientX,t.clientY);

},{passive:false});

joystick.addEventListener("touchmove",e=>{

  e.preventDefault();

  if(!joy.active)return;

  const t=e.touches[0];

  joystickMove(t.clientX,t.clientY);

},{passive:false});

joystick.addEventListener("touchend",joystickEnd);

/* =========================

   DI CHUYỂN

========================= */

function updatePlayer(){

  if(!joy.active)return;

  const speed=3.2;

  player.x += joy.x*speed;

  player.y += joy.y*speed;

  const a=areas[currentArea];

  player.x=Math.max(80,Math.min(a.maxX-80,player.x));

  player.y=Math.max(80,Math.min(a.maxY-80,player.y));

  if(Math.abs(joy.x)+Math.abs(joy.y)>0){

    player.direction=Math.atan2(joy.y,joy.x);

  }

  checkAreaGate();

}

/* =========================

   CHUYỂN KHU VỰC

========================= */

function checkAreaGate(){

  if(currentArea==="village" && player.x>3000){

    changeArea("forest");

    return;

  }

  if(currentArea==="forest" && player.x>3400){

    changeArea("wudang");

    return;

  }

  if(currentArea!=="village" && player.x<100){

    changeArea("village");

  }

}

function changeArea(area){

  currentArea=area;

  player.x=areas[area].spawn.x;

  player.y=areas[area].spawn.y;

  spawnMonsters();

  if(area==="wudang"){

    quests.q3.progress=1;

    quests.q3.done=true;

  }

  toast("🗺️ Đã đến "+areas[area].name);

  updateUI();

}

/* =========================

   KHOẢNG CÁCH

========================= */

function distance(a,b){

  return Math.hypot(a.x-b.x,a.y-b.y);

}

/* =========================

   QUÁI AI

========================= */

function updateMonsters(){

  for(const m of monsters){

    if(!m.alive){

      if(m.respawn>0){

        m.respawn--;

      }

      if(m.respawn<=0){

        m.alive=true;

        m.hp=m.maxHp;

        m.x=player.x+(Math.random()*600-300);

        m.y=player.y+(Math.random()*600-300);

      }

      continue;

    }

    const d=distance(player,m);

    if(d<420){

      const dx=(player.x-m.x)/Math.max(d,1);

      const dy=(player.y-m.y)/Math.max(d,1);

      if(d>58){

        m.x+=dx*m.speed;

        m.y+=dy*m.speed;

      }else{

        m.attackTimer--;

        if(m.attackTimer<=0){

          m.attackTimer=75;

          if(Math.random()<.85){

            const damage=Math.max(

              1,

              m.attack-player.defense

            );

            player.hp-=damage;

            damageText(

              player.x,

              player.y-50,

              "-"+damage

            );

            if(player.hp<=0){

              player.hp=player.maxHp;

              player.mp=0;

              player.x=areas[currentArea].spawn.x;

              player.y=areas[currentArea].spawn.y;

              toast("💀 Bạn đã bị đánh bại!");

            }

          }

        }

      }

    }

    if(m.hitFlash>0)m.hitFlash--;

  }

}

/* =========================

   ĐÁNH THƯỜNG

========================= */

function nearestMonster(){

  let best=null;

  let bd=Infinity;

  for(const m of monsters){

    if(!m.alive)continue;

    const d=distance(player,m);

    if(d<bd && d<330){

      bd=d;

      best=m;

    }

  }

  return best;

}

function attack(){

  const m=nearestMonster();

  if(!m){

    toast("⚔️ Không có mục tiêu gần!");

    return;

  }

  if(player.attackCD>0)return;

  player.attackCD=28;

  const damage=

    player.attack+

    Math.floor(Math.random()*8)+1;

  m.hp-=damage;

  m.hitFlash=8;

  damageText(

    m.x,

    m.y-45,

    "-"+damage

  );

  showSlash();

  if(m.hp<=0){

    killMonster(m);

  }

}

function killMonster(m){

  m.alive=false;

  m.respawn=240;

  player.exp+=25;

  player.gold+=10+Math.floor(Math.random()*20);

  quests.q1.progress++;

  if(Math.random()<.55){

    addItem("iron",1);

    quests.q2.progress++;

  }

  if(player.exp>=player.maxExp){

    player.exp-=player.maxExp;

    player.level++;

    player.maxExp=Math.floor(player.maxExp*1.25);

    player.maxHp+=15;

    player.hp=player.maxHp;

    player.attack+=3;

    toast("🎉 Lên cấp "+player.level+"!");

  }else{

    toast("⚔️ Hạ Sơn Tặc! +EXP");

  }

  updateQuestStatus();

  updateUI();

}

/* =========================

   KỸ NĂNG

========================= */

function skill(){

  if(player.skillCD>0)return;

  if(player.mp<30){

    toast("✨ Không đủ nội lực!");

    return;

  }

  const m=nearestMonster();

  if(!m){

    toast("☯️ Không có mục tiêu!");

    return;

  }

  player.mp-=30;

  player.skillCD=100;

  const damage=

    player.attack*2+

    Math.floor(Math.random()*12);

  m.hp-=damage;

  m.hitFlash=12;

  damageText(

    m.x,

    m.y-70,

    "-"+damage

  );

  skillEffect(m.x,m.y);

  if(m.hp<=0){

    killMonster(m);

  }

  updateUI();

}

/* =========================

   HỒI NỘI LỰC

========================= */

function updateTimers(){

  if(player.attackCD>0)player.attackCD--;

  if(player.skillCD>0)player.skillCD--;

  if(player.mp<player.maxMp){

    player.mp+=0.08;

  }

}

/* =========================

   VẬT PHẨM

========================= */

function addItem(id,count){

  let item=player.inventory.find(x=>x.id===id);

  if(!item){

    item={

      id,

      name:items[id].name,

      count:0

    };

    player.inventory.push(item);

  }

  item.count+=count;

}

function usePotion(){

  const p=player.inventory.find(x=>x.id==="potion");

  if(!p || p.count<=0){

    toast("Không còn Tiểu Hoàn Đan!");

    return;

  }

  if(player.hp>=player.maxHp){

    toast("❤️ HP đã đầy!");

    return;

  }

  p.count--;

  player.hp=Math.min(

    player.maxHp,

    player.hp+50

  );

  toast("❤️ Hồi 50 HP");

  updateUI();

}

function equipWeapon(){

  if(player.equipment.weapon){

    toast("Đã trang bị vũ khí!");

    return;

  }

  const p=player.inventory.find(x=>x.id==="sword");

  if(!p || p.count<=0){

    toast("Chưa có vũ khí!");

    return;

  }

  p.count--;

  player.equipment.weapon="sword";

  player.attack+=items.sword.attack;

  toast("⚔️ Đã trang bị Kiếm Tân Thủ!");

  updateUI();

}

function equipArmor(){

  if(player.equipment.armor){

    toast("Đã trang bị giáp!");

    return;

  }

  const p=player.inventory.find(x=>x.id==="armor");

  if(!p || p.count<=0){

    toast("Chưa có giáp!");

    return;

  }

  p.count--;

  player.equipment.armor="armor";

  player.defense+=items.armor.defense;

  toast("🛡️ Đã trang bị Giáp Võ Đang!");

  updateUI();

}

/* =========================

   NPC

========================= */

function nearestNPC(){

  let best=null;

  let bd=Infinity;

  for(const n of npcs){

    if(n.area!==currentArea)continue;

    const d=distance(player,n);

    if(d<bd && d<180){

      bd=d;

      best=n;

    }

  }

  return best;

}

function talkNPC(){

  const n=nearestNPC();

  if(!n){

    toast("🧑 Không có NPC gần đây!");

    return;

  }

  openNPC(n);

}

function openNPC(n){

  document.getElementById("npcTitle").textContent=

    n.icon+" "+n.name;

  let html="";

  if(n.id==="elder"){

    html+=`

      <p>Thiếu hiệp, vùng đất này đang bị Sơn Tặc quấy phá.</p>

      <p>Hãy giúp dân làng đánh bại chúng.</p>

      <button onclick="acceptQuest('q1')">📜 Nhận nhiệm vụ</button>

    `;

  }

  if(n.id==="blacksmith"){

    html+=`

      <p>Ta có thể giúp ngươi trang bị vũ khí.</p>

      <button onclick="buySword()">⚔️ Mua Kiếm · 100 🪙</button>

      <button onclick="buyArmor()">🛡️ Mua Giáp · 150 🪙</button>

    `;

  }

  if(n.id==="merchant"){

    html+=`

      <p>Hàng hóa của ta đây.</p>

      <button onclick="buyPotion()">❤️ Tiểu Hoàn Đan · 20 🪙</button>

      <button onclick="buyArmor()">🛡️ Giáp · 150 🪙</button>

    `;

  }

  if(n.id==="master"){

    html+=`

      <p>Võ Đang là nơi tu luyện của cao thủ.</p>

      <p>Ngươi đã đủ duyên bước vào con đường võ học.</p>

      <button onclick="acceptQuest('q3')">⛰️ Nhận nhiệm vụ Võ Đang</button>

    `;

  }

  document.getElementById("npcContent").innerHTML=html;

  document.getElementById("npcModal").style.display="flex";

}

function buySword(){

  if(player.gold<100){

    toast("🪙 Không đủ tiền!");

    return;

  }

  player.gold-=100;

  addItem("sword",1);

  toast("⚔️ Nhận Kiếm Tân Thủ!");

  updateUI();

}

function buyArmor(){

  if(player.gold<150){

    toast("🪙 Không đủ tiền!");

    return;

  }

  player.gold-=150;

  addItem("armor",1);

  toast("🛡️ Nhận Giáp Võ Đang!");

  updateUI();

}

function buyPotion(){

  if(player.gold<20){

    toast("🪙 Không đủ tiền!");

    return;

  }

  player.gold-=20;

  addItem("potion",1);

  toast("❤️ Mua Tiểu Hoàn Đan!");

  updateUI();

}

/* =========================

   NHIỆM VỤ

========================= */

function acceptQuest(id){

  if(id==="q1"){

    toast("📜 Đã nhận nhiệm vụ Dẹp loạn Sơn Tặc!");

  }else if(id==="q3"){

    toast("⛰️ Hãy tiến vào Núi Võ Đang!");

  }

  closeModal("npcModal");

}

function updateQuestStatus(){

  if(quests.q1.progress>=quests.q1.need){

    quests.q1.done=true;

  }

  if(quests.q2.progress>=quests.q2.need){

    quests.q2.done=true;

  }

}

function claimQuest(id){

  const q=quests[id];

  if(!q.done){

    toast("📜 Chưa hoàn thành nhiệm vụ!");

    return;

  }

  if(q.claimed){

    toast("Đã nhận thưởng rồi!");

    return;

  }

  q.claimed=true;

  player.exp+=q.rewardExp;

  player.gold+=q.rewardGold;

  while(player.exp>=player.maxExp){

    player.exp-=player.maxExp;

    player.level++;

    player.maxExp=Math.floor(player.maxExp*1.25);

    player.maxHp+=15;

    player.hp=player.maxHp;

    player.attack+=3;

  }

  toast(

    "🎁 Nhận thưởng +"+

    q.rewardExp+" EXP +"+

    q.rewardGold+" 🪙"

  );

  updateUI();

  renderQuests();

}

/* =========================

   GIAO DIỆN

========================= */

function updateUI(){

  document.getElementById("levelText").textContent=

    "Cấp "+player.level+" · Võ Đang";

  document.getElementById("hpText").textContent=

    Math.max(0,Math.floor(player.hp))+

    "/"+player.maxHp;

  document.getElementById("expText").textContent=

    Math.floor(player.exp)+

    "/"+player.maxExp;

  document.getElementById("goldText").textContent=

    Math.floor(player.gold);

  document.getElementById("coordText").textContent=

    Math.floor(player.x)+","+Math.floor(player.y);

  document.getElementById("areaText").textContent=

    areas[currentArea].name;

  document.getElementById("hpBar").style.width=

    (player.hp/player.maxHp*100)+"%";

  document.getElementById("mpBar").style.width=

    (player.mp/player.maxMp*100)+"%";

  const m=nearestMonster();

  const target=document.getElementById("target");

  if(m){

    target.style.display="block";

    target.textContent=

      "👹 "+m.type+" · "+

      Math.max(0,Math.floor(m.hp))+

      "/"+m.maxHp;

  }else{

    target.style.display="none";

  }

}

/* =========================

   TÚI ĐỒ

========================= */

function renderInventory(){

  const box=document.getElementById("inventory");

  let html="";

  for(const it of player.inventory){

    if(it.count<=0)continue;

    let action="";

    if(it.id==="potion"){

      action=

        `<button onclick="usePotion()">Dùng</button>`;

    }

    if(it.id==="sword"){

      action=

        `<button onclick="equipWeapon()">Trang bị</button>`;

    }

    if(it.id==="armor"){

      action=

        `<button onclick="equipArmor()">Trang bị</button>`;

    }

    html+=`

      <div class="item">

        <span>${it.name} ×${it.count}</span>

        ${action}

      </div>

    `;

  }

  if(!html){

    html="<p>Túi đồ đang trống.</p>";

  }

  box.innerHTML=html;

  document.getElementById("equipment").innerHTML=`

    <p>⚔️ Vũ khí:

      ${player.equipment.weapon ? "Kiếm Tân Thủ" : "Chưa trang bị"}

    </p>

    <p>🛡️ Giáp:

      ${player.equipment.armor ? "Giáp Võ Đang" : "Chưa trang bị"}

    </p>

    <p>⚔️ Công kích: ${player.attack}</p>

    <p>🛡️ Phòng thủ: ${player.defense}</p>

  `;

}

/* =========================

   QUEST UI

========================= */

function renderQuests(){

  const box=document.getElementById("quests");

  let html="";

  for(const id in quests){

    const q=quests[id];

    html+=`

      <div class="quest">

        <b>📜 ${q.title}</b>

        <p>${q.desc}</p>

        <p>

          Tiến độ:

          ${Math.min(q.progress,q.need)}/${q.need}

        </p>

        <p>

          🎁 ${q.rewardExp} EXP ·

          ${q.rewardGold} 🪙

        </p>

        ${

          q.done && !q.claimed

          ?

          `<button onclick="claimQuest('${id}')">

             🎁 Nhận thưởng

           </button>`

          :

          q.claimed

          ?

          `<span>✅ Đã hoàn thành</span>`

          :

          `<span>⏳ Đang thực hiện</span>`

        }

      </div>

    `;

  }

  box.innerHTML=html;

}

/* =========================

   MODAL

========================= */

function openModal(id){

  document.getElementById(id).style.display="flex";

  if(id==="bagModal")renderInventory();

  if(id==="questModal")renderQuests();

}

function closeModal(id){

  document.getElementById(id).style.display="none";

}

/* =========================

   HIỆU ỨNG

========================= */

let effects=[];

let texts=[];

function damageText(x,y,text){

  texts.push({

    x,y,text,

    life:45

  });

}

function showSlash(){

  effects.push({

    type:"slash",

    x:player.x,

    y:player.y,

    life:15

  });

}

function skillEffect(x,y){

  effects.push({

    type:"skill",

    x,y,

    life:28

  });

}

function updateEffects(){

  for(const e of effects)e.life--;

  effects=effects.filter(e=>e.life>0);

  for(const t of texts){

    t.y-=.5;

    t.life--;

  }

  texts=texts.filter(t=>t.life>0);

}

/* =========================

   VẼ BẢN ĐỒ

========================= */

function drawBackground(){

  const a=areas[currentArea];

  ctx.fillStyle=a.color;

  ctx.fillRect(0,0,W,H);

  const grid=160;

  ctx.strokeStyle="rgba(255,255,255,.055)";

  ctx.lineWidth=1;

  for(

    let x=-(camera.x%grid);

    x<W;

    x+=grid

  ){

    ctx.beginPath();

    ctx.moveTo(x,0);

    ctx.lineTo(x,H);

    ctx.stroke();

  }

  for(

    let y=-(camera.y%grid);

    y<H;

    y+=grid

  ){

    ctx.beginPath();

    ctx.moveTo(0,y);

    ctx.lineTo(W,y);

    ctx.stroke();

  }

  drawTrees();

  drawDecorations();

  drawGates();

  if(currentArea==="village"){

    drawVillage();

  }

}

function worldToScreen(x,y){

  return {

    x:x-camera.x,

    y:y-camera.y

  };

}

function drawTrees(){

  const count=

    currentArea==="village" ? 35 : 45;

  for(let i=0;i<count;i++){

    const x=(i*487)%areas[currentArea].maxX;

    const y=(i*719)%areas[currentArea].maxY;

    const p=worldToScreen(x,y);

    if(p.x<-100||p.x>W+100||

       p.y<-150||p.y>H+150)continue;

    ctx.fillStyle="#654027";

    ctx.fillRect(p.x-12,p.y,p.x+12-p.x,55);

    ctx.fillStyle=

      currentArea==="wudang"

      ? "#315448"

      : "#1c5a35";

    ctx.beginPath();

    ctx.arc(p.x,p.y-20,42,0,Math.PI*2);

    ctx.fill();

    ctx.beginPath();

    ctx.arc(p.x-30,p.y-2,30,0,Math.PI*2);

    ctx.fill();

    ctx.beginPath();

    ctx.arc(p.x+30,p.y-2,30,0,Math.PI*2);

    ctx.fill();

  }

}

function drawDecorations(){

  for(let i=0;i<30;i++){

    const x=(i*317)%areas[currentArea].maxX;

    const y=(i*173)%areas[currentArea].maxY;

    const p=worldToScreen(x,y);

    if(p.x<0||p.x>W||p.y<0||p.y>H)continue;

    ctx.fillStyle="#e6c65e";

    ctx.beginPath();

    ctx.arc(p.x,p.y,4,0,Math.PI*2);

    ctx.fill();

  }

}

function drawGates(){

  if(currentArea==="village"){

    const p=worldToScreen(3000,1200);

    if(p.x>-100&&p.x<W+100){

      ctx.fillStyle="#d8bc71";

      ctx.fillRect(p.x-18,p.y-100,36,200);

      ctx.fillStyle="#fff0a2";

      ctx.font="bold 15px sans-serif";

      ctx.textAlign="center";

      ctx.fillText("🌲 Rừng",p.x,p.y-115);

    }

  }

  if(currentArea==="forest"){

    const p=worldToScreen(3400,1200);

    if(p.x>-100&&p.x<W+100){

      ctx.fillStyle="#9a9a9a";

      ctx.fillRect(p.x-18,p.y-100,36,200);

      ctx.fillStyle="#fff";

      ctx.font="bold 15px sans-serif";

      ctx.textAlign="center";

      ctx.fillText("⛰️ Võ Đang",p.x,p.y-115);

    }

  }

}

function drawVillage(){

  for(const n of npcs){

    const p=worldToScreen(n.x,n.y);

    if(p.x<-100||p.x>W+100||

       p.y<-100||p.y>H+100)continue;

    ctx.fillStyle="#b98255";

    ctx.fillRect(

      p.x-35,

      p.y,

      70,

      50

    );

    ctx.fillStyle="#7d3326";

    ctx.beginPath();

    ctx.moveTo(p.x-45,p.y);

    ctx.lineTo(p.x,p.y-45);

    ctx.lineTo(p.x+45,p.y);

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle="#fff";

    ctx.font="14px sans-serif";

    ctx.textAlign="center";

    ctx.fillText(

      n.icon+" "+n.name,

      p.x,

      p.y-55

    );

  }

}

/* =========================

   VẼ QUÁI

========================= */

function drawMonster(m){

  if(!m.alive)return;

  const p=worldToScreen(m.x,m.y);

  if(p.x<-100||p.x>W+100||

     p.y<-100||p.y>H+100)return;

  ctx.save();

  if(m.hitFlash%2===1){

    ctx.globalAlpha=.55;

  }

  ctx.fillStyle="#17251b";

  ctx.beginPath();

  ctx.ellipse(

    p.x,

    p.y+27,

    38,

    12,

    0,0,Math.PI*2

  );

  ctx.fill();

  ctx.fillStyle=

    currentArea==="wudang"

    ? "#705238"

    : "#984e3d";

  ctx.beginPath();

  ctx.arc(p.x,p.y,36,0,Math.PI*2);

  ctx.fill();

  ctx.fillStyle="#ffe66b";

  ctx.beginPath();

  ctx.arc(p.x-11,p.y-6,6,0,Math.PI*2);

  ctx.fill();

  ctx.beginPath();

  ctx.arc(p.x+11,p.y-6,6,0,Math.PI*2);

  ctx.fill();

  ctx.fillStyle="#222";

  ctx.font="14px sans-serif";

  ctx.textAlign="center";

  ctx.fillText(

    m.type,

    p.x,

    p.y-55

  );

  ctx.fillStyle="#d94848";

  ctx.fillRect(

    p.x-42,

    p.y-46,

    84,

    7

  );

  ctx.fillStyle="#55d26a";

  ctx.fillRect(

    p.x-42,

    p.y-46,

    84*(m.hp/m.maxHp),

    7

  );

  ctx.restore();

}

/* =========================

   VẼ PLAYER

========================= */

function drawPlayer(){

  const p=worldToScreen(player.x,player.y);

  ctx.save();

  ctx.fillStyle="rgba(0,0,0,.3)";

  ctx.beginPath();

  ctx.ellipse(

    p.x,

    p.y+38,

    34,

    10,

    0,0,Math.PI*2

  );

  ctx.fill();

  ctx.fillStyle="#f0e8d0";

  ctx.beginPath();

  ctx.moveTo(p.x-25,p.y+10);

  ctx.lineTo(p.x-8,p.y-20);

  ctx.lineTo(p.x+15,p.y-20);

  ctx.lineTo(p.x+28,p.y+28);

  ctx.lineTo(p.x+5,p.y+45);

  ctx.lineTo(p.x-24,p.y+30);

  ctx.closePath();

  ctx.fill();

  ctx.fillStyle="#f3c5a1";

  ctx.beginPath();

  ctx.arc(p.x,p.y-35,19,0,Math.PI*2);

  ctx.fill();

  ctx.fillStyle="#171717";

  ctx.beginPath();

  ctx.arc(

    p.x,

    p.y-40,

    20,

    Math.PI,

    Math.PI*2

  );

  ctx.fill();

  ctx.strokeStyle="#ddd";

  ctx.lineWidth=6;

  ctx.beginPath();

  ctx.moveTo(p.x+12,p.y+10);

  ctx.lineTo(

    p.x+45,

    p.y-38

  );

  ctx.stroke();

  ctx.restore();

}

/* =========================

   EFFECTS

========================= */

function drawEffects(){

  for(const e of effects){

    const p=worldToScreen(e.x,e.y);

    if(e.type==="slash"){

      ctx.save();

      ctx.strokeStyle="rgba(255,255,255,"+

        (e.life/15)+")";

      ctx.lineWidth=7;

      ctx.beginPath();

      ctx.arc(

        p.x,

        p.y,

        60,

        -1.0,

        1.0

      );

      ctx.stroke();

      ctx.restore();

    }

    if(e.type==="skill"){

      ctx.save();

      ctx.strokeStyle=

        "rgba(100,220,255,"+

        (e.life/28)+")";

      ctx.lineWidth=5;

      ctx.beginPath();

      ctx.arc(

        p.x,

        p.y,

        90-(e.life*2),

        0,

        Math.PI*2

      );

      ctx.stroke();

      ctx.restore();

    }

  }

  for(const t of texts){

    const p=worldToScreen(t.x,t.y);

    ctx.fillStyle="#ffe66b";

    ctx.font="bold 17px sans-serif";

    ctx.textAlign="center";

    ctx.fillText(

      t.text,

      p.x,

      p.y

    );

  }

}

/* =========================

   GAME LOOP

========================= */

function draw(){

  updateCamera();

  drawBackground();

  for(const m of monsters){

    drawMonster(m);

  }

  drawPlayer();

  drawEffects();

  requestAnimationFrame(draw);

}

function update(){

  updatePlayer();

  updateMonsters();

  updateTimers();

  updateEffects();

  updateUI();

  requestAnimationFrame(update);

}

/* =========================

   CHẠM NPC

========================= */

canvas.addEventListener("touchend",e=>{

  const t=e.changedTouches[0];

  const rect=canvas.getBoundingClientRect();

  const sx=t.clientX-rect.left;

  const sy=t.clientY-rect.top;

  const wx=sx+camera.x;

  const wy=sy+camera.y;

  for(const n of npcs){

    if(n.area!==currentArea)continue;

    if(Math.hypot(wx-n.x,wy-n.y)<90){

      player.x=n.x+100;

      talkNPC();

      return;

    }

  }

},{passive:true});

/* =========================

   MESSAGE

========================= */

let messageTimer=0;

function showMessage(text){

  const el=document.getElementById("message");

  el.textContent=text;

  el.style.display="block";

  clearTimeout(messageTimer);

  messageTimer=setTimeout(()=>{

    el.style.display="none";

  },1800);

}

function toast(text){

  const el=document.getElementById("toast");

  el.textContent=text;

  el.style.display="block";

  clearTimeout(el._timer);

  el._timer=setTimeout(()=>{

    el.style.display="none";

  },1500);

}

/* =========================

   LƯU GAME

========================= */

function saveGame(){

  const data={

    player,

    currentArea,

    quests

  };

  localStorage.setItem(

    "kiemTheMobi31",

    JSON.stringify(data)

  );

}

function loadGame(){

  try{

    const raw=localStorage.getItem(

      "kiemTheMobi31"

    );

    if(!raw)return;

    const data=JSON.parse(raw);

    if(data.player){

      Object.assign(player,data.player);

    }

    if(data.currentArea &&

       areas[data.currentArea]){

      currentArea=data.currentArea;

    }

    if(data.quests){

      for(const id in quests){

        if(data.quests[id]){

          Object.assign(

            quests[id],

            data.quests[id]

          );

        }

      }

    }

  }catch(e){

    console.log("Không thể tải save",e);

  }

}

setInterval(saveGame,3000);

addEventListener("beforeunload",saveGame);

/* =========================

   KHỞI ĐỘNG

========================= */

loadGame();

spawnMonsters();

updateQuestStatus();

updateUI();

draw();

update();

showMessage(

  "⚔️ Kiếm Thế Mobi · Bản 3.1"

);
