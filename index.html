<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Đại Việt Chiến Ký — Bản Chơi 2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06130d;font-family:Arial,sans-serif}
body{display:flex;justify-content:center}
#game{position:relative;width:100vw;height:100dvh;max-width:720px;overflow:hidden;background:#07140e}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;opacity:.78;filter:saturate(1.05) contrast(1.02);z-index:0}
#shade{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(3,9,6,.35),transparent 23%,transparent 77%,rgba(3,9,6,.42)),linear-gradient(0deg,rgba(2,8,5,.78),transparent 28%)}
#cv{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none}
button{border:2px solid #a87424;background:rgba(18,12,5,.91);color:#ffe5a0;border-radius:18px;font-weight:800;box-shadow:0 2px 8px #0009;font-family:Arial,sans-serif}
.ui{position:absolute;z-index:6}
#hud{left:3%;top:3%;width:46%;max-width:330px;padding:10px 12px;border:2px solid #a87424;border-radius:18px;background:rgba(10,10,5,.9);color:#ffe5a0;font-weight:800;font-size:clamp(12px,2.6vw,18px);line-height:1.12}
.bar{height:10px;border-radius:8px;background:#111;margin:5px 0;overflow:hidden;border:1px solid #333}.bar i{display:block;height:100%;width:100%}.hp i{background:#e12626}.mp i{background:#1687e8}
#mission{left:3%;top:20%;width:30%;max-width:215px;padding:10px;font-size:clamp(11px,2vw,15px);line-height:1.35}
.side{right:3%;width:15%;min-width:64px;height:7%;font-size:clamp(10px,1.8vw,14px)}
#shop{top:14%}#bag{top:22%}#skill{top:30%}#quest{top:38%}#pet{top:46%}#spin{top:54%}#event{top:62%}
#joy{left:5%;bottom:15%;width:120px;height:120px;border-radius:50%;font-size:32px;background:rgba(20,13,5,.78)}
#skill1,#skill2{bottom:17%;width:64px;height:64px;border-radius:50%;font-size:27px}.skill{background:rgba(20,13,5,.88)}
#skill1{right:24%}#skill2{right:15%}
#attack{right:3%;bottom:15%;width:86px;height:86px;border-radius:50%;font-size:36px;background:#842d24}
.menu{bottom:2%;height:8%;font-size:clamp(9px,1.8vw,13px);padding:3px;background:rgba(12,9,4,.92)}
#m1{left:3%;width:18%}#m2{left:22%;width:18%}#m3{left:41%;width:18%}#m4{left:60%;width:18%}#m5{right:3%;width:18%}
#msg{left:50%;bottom:31%;transform:translateX(-50%);padding:10px 18px;border-radius:15px;background:#111d;color:#ffe5a0;border:1px solid #a87424;opacity:0;transition:.2s;z-index:10;pointer-events:none;white-space:nowrap;font-weight:800}
#msg.show{opacity:1}
#hint{position:absolute;left:50%;top:12%;transform:translateX(-50%);z-index:5;color:#fff0b0;background:#0009;padding:7px 12px;border-radius:12px;font-size:12px;white-space:nowrap;pointer-events:none}
@media(max-width:430px){#hud{width:48%;font-size:12px}#mission{width:34%;top:21%;font-size:11px}.side{width:16%;min-width:60px}#joy{width:112px;height:112px;bottom:17%}#attack{width:78px;height:78px;bottom:17%}#skill1,#skill2{width:57px;height:57px;bottom:18%}.menu{height:8.5%;font-size:10px}}
</style>
</head>
<body>
<div id="game">
<img id="bg" src="game-art.jpg" alt="">
<div id="shade"></div>
<canvas id="cv"></canvas>

<div id="hud" class="ui">⚔️ ĐẠI VIỆT CHIẾN KÝ<br>Lv <span id="lv">1</span> · ❤️ <span id="hpText">120</span>/120
<div class="bar hp"><i id="hpbar"></i></div>🔵 <span id="mpText">80/80</span><div class="bar mp"><i></i></div>🪙 <span id="gold">1760</span> · ⭐ <span id="star">3</span></div>
<div id="hint">Kéo joystick để di chuyển • ⚔️ đánh quái gần nhất</div>
<button id="mission" class="ui">🎯 NHIỆM VỤ<br>Hạ 3 Sơn Tặc<br>Tiến độ <b id="progress">0/3</b></button>
<button id="shop" class="ui side">🧰<br>Tiệm</button><button id="bag" class="ui side">🎒<br>Túi Đồ</button><button id="skill" class="ui side">⚡<br>Kỹ Năng</button><button id="quest" class="ui side">📜<br>Nhiệm Vụ</button><button id="pet" class="ui side">🐕<br>Pet</button><button id="spin" class="ui side">🎡<br>Vòng Quay</button><button id="event" class="ui side">🎁<br>Sự Kiện</button>
<button id="joy" class="ui">✦</button><button id="skill1" class="ui skill">🔥</button><button id="skill2" class="ui skill">⚡</button><button id="attack" class="ui">⚔️</button>
<button id="m1" class="ui menu">👤<br>Nhân Vật</button><button id="m2" class="ui menu">🛡️<br>Trang Bị</button><button id="m3" class="ui menu">🚩<br>Bang Hội</button><button id="m4" class="ui menu">👥<br>Bạn Bè</button><button id="m5" class="ui menu">⚙️<br>Cài Đặt</button>
<div id="msg" class="ui"></div>
</div>
<script>
const canvas=document.getElementById('cv'),ctx=canvas.getContext('2d'),game=document.getElementById('game');
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=game.clientWidth;H=game.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const player={x:.50,y:.64,hp:120,max:120,speed:.00034,dir:1,walk:0,flash:0};
const enemies=[
{x:.29,y:.56,hp:60,max:60,alive:true,dir:1,flash:0},
{x:.69,y:.53,hp:60,max:60,alive:true,dir:-1,flash:0},
{x:.74,y:.70,hp:60,max:60,alive:true,dir:-1,flash:0}
];
let kills=0,attackCd=0,skillCd=0,last=performance.now(),joyX=0,joyY=0,joyActive=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function toast(t){const m=document.getElementById('msg');m.textContent=t;m.classList.add('show');clearTimeout(window.tm);window.tm=setTimeout(()=>m.classList.remove('show'),1050)}
function pxy(o){return{x:o.x*W,y:o.y*H}}
function label(text,x,y,color){ctx.font='800 13px Arial';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.75)';ctx.strokeText(text,x,y);ctx.fillStyle=color;ctx.fillText(text,x,y)}
function shadow(s){ctx.fillStyle='rgba(0,0,0,.38)';ctx.beginPath();ctx.ellipse(0,s*.72,s*.72,s*.22,0,0,Math.PI*2);ctx.fill()}
function drawPlayer(){const p=pxy(player),s=Math.max(28,Math.min(40,W*.095)),bob=Math.sin(player.walk)*2;ctx.save();ctx.translate(p.x,p.y+bob);shadow(s);
// legs
ctx.strokeStyle='#172234';ctx.lineWidth=s*.18;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-s*.18,s*.35);ctx.lineTo(-s*.28,s*.72);ctx.moveTo(s*.16,s*.35);ctx.lineTo(s*.30,s*.70);ctx.stroke();
// robe
ctx.fillStyle='#183b5c';ctx.beginPath();ctx.moveTo(-s*.43,-s*.02);ctx.lineTo(s*.43,-s*.02);ctx.lineTo(s*.34,s*.48);ctx.lineTo(-s*.34,s*.48);ctx.closePath();ctx.fill();
ctx.fillStyle='#0d2439';ctx.fillRect(-s*.44,s*.18,s*.88,s*.12);ctx.fillStyle='#9d5a2d';ctx.fillRect(-s*.45,s*.18,s*.9,s*.07);
// face
ctx.fillStyle='#f0bd88';ctx.beginPath();ctx.ellipse(0,-s*.34,s*.34,s*.39,0,0,Math.PI*2);ctx.fill();
// hair ponytail
ctx.fillStyle='#17151a';ctx.beginPath();ctx.arc(-s*.18,-s*.55,s*.28,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(s*.02,-s*.58,s*.36,Math.PI,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(s*.25,-s*.55);ctx.quadraticCurveTo(s*.75,-s*.7,s*.38,-s*.12);ctx.quadraticCurveTo(s*.18,-s*.32,s*.25,-s*.55);ctx.fill();
// eyes
ctx.fillStyle='#16120f';ctx.beginPath();ctx.arc(-s*.12,-s*.34,s*.035,0,7);ctx.arc(s*.12,-s*.34,s*.035,0,7);ctx.fill();
// sword
ctx.strokeStyle='#dbe8ef';ctx.lineWidth=s*.09;ctx.beginPath();ctx.moveTo(s*.28,s*.06);ctx.lineTo(s*.85,-s*.48);ctx.stroke();ctx.strokeStyle='#b88642';ctx.lineWidth=s*.05;ctx.beginPath();ctx.moveTo(s*.14,s*.02);ctx.lineTo(s*.35,s*.22);ctx.stroke();
ctx.restore();label('ĐạiViệt',p.x,p.y-s*.95,'#8dff72');
}
function drawEnemy(e){if(!e.alive)return;const p=pxy(e),s=Math.max(27,Math.min(38,W*.09));ctx.save();ctx.translate(p.x,p.y);shadow(s);
ctx.strokeStyle='#3c2416';ctx.lineWidth=s*.18;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-s*.18,s*.32);ctx.lineTo(-s*.28,s*.7);ctx.moveTo(s*.17,s*.32);ctx.lineTo(s*.28,s*.68);ctx.stroke();
ctx.fillStyle='#75451f';ctx.beginPath();ctx.moveTo(-s*.43,-s*.03);ctx.lineTo(s*.43,-s*.03);ctx.lineTo(s*.34,s*.48);ctx.lineTo(-s*.34,s*.48);ctx.closePath();ctx.fill();
ctx.fillStyle='#9a5d2e';ctx.fillRect(-s*.45,s*.16,s*.9,s*.08);ctx.fillStyle='#f0b77e';ctx.beginPath();ctx.arc(0,-s*.36,s*.34,0,7);ctx.fill();
ctx.fillStyle='#3a2117';ctx.fillRect(-s*.38,-s*.62,s*.76,s*.12);ctx.fillRect(-s*.2,-s*.72,s*.4,s*.10);
ctx.fillStyle='#17100e';ctx.beginPath();ctx.arc(-s*.12,-s*.37,s*.035,0,7);ctx.arc(s*.12,-s*.37,s*.035,0,7);ctx.fill();
ctx.strokeStyle='#e6edf2';ctx.lineWidth=s*.09;ctx.beginPath();ctx.moveTo(-s*.2,s*.08);ctx.lineTo(-s*.85,-s*.43);ctx.stroke();ctx.restore();
label('Sơn Tặc',p.x,p.y-s*.98,'#ff3434');ctx.fillStyle='#210909';ctx.fillRect(p.x-s*.65,p.y-s*.88,s*1.3,5);ctx.fillStyle='#e21d28';ctx.fillRect(p.x-s*.65,p.y-s*.88,s*1.3*Math.max(0,e.hp/e.max),5);
}
function update(dt){if(joyActive){const mag=Math.min(1,Math.hypot(joyX,joyY));player.x=clamp(player.x+joyX*player.speed*dt,.11,.87);player.y=clamp(player.y+joyY*player.speed*dt,.30,.83);if(mag>.08){player.walk+=dt*.018;player.dir=joyX>=0?1:-1}}
attackCd-=dt;skillCd-=dt;player.flash=Math.max(0,player.flash-dt);
for(const e of enemies){if(!e.alive)continue;const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy);if(d<.23){e.x+=dx/(d||1)*.000055*dt;e.y+=dy/(d||1)*.000055*dt;e.dir=dx>=0?1:-1}if(d<.058&&Math.random()<.010){player.hp=Math.max(0,player.hp-3);player.flash=120}}
document.getElementById('hpText').textContent=player.hp;document.getElementById('hpbar').style.width=(player.hp/player.max*100)+'%';}
function render(){ctx.clearRect(0,0,W,H);for(const e of enemies)drawEnemy(e);drawPlayer();if(player.flash>0){ctx.fillStyle='rgba(255,40,30,.14)';ctx.fillRect(0,0,W,H)}requestAnimationFrame(loop)}
function loop(t){const dt=Math.min(40,t-last);last=t;update(dt);render()}requestAnimationFrame(loop);
function attack(){if(attackCd>0)return;attackCd=320;let target=null,best=999;for(const e of enemies)if(e.alive){const d=Math.hypot(player.x-e.x,player.y-e.y);if(d<best){best=d;target=e}}if(target&&best<.21){target.hp-=30;target.flash=140;toast(target.hp<=0?'💥 Hạ Sơn Tặc!':'⚔️ Gây 30 sát thương');if(target.hp<=0){target.alive=false;kills++;document.getElementById('progress').textContent=kills+'/3';document.getElementById('gold').textContent=1760+kills*150;if(kills===3)toast('🎉 Hoàn thành nhiệm vụ!')}}else toast('⚔️ Tiến gần Sơn Tặc hơn')}
function skill1(){if(skillCd>0)return;skillCd=900;let hit=0;for(const e of enemies)if(e.alive&&Math.hypot(player.x-e.x,player.y-e.y)<.28){e.hp-=45;hit++;if(e.hp<=0){e.alive=false;kills++;document.getElementById('progress').textContent=kills+'/3'}}toast(hit?'🔥 Hỏa Kích trúng '+hit+' mục tiêu':'🔥 Không có quái trong tầm')}
document.getElementById('attack').onclick=attack;document.getElementById('skill1').onclick=skill1;document.getElementById('skill2').onclick=()=>toast('⚡ Lôi Kích!');document.querySelectorAll('.side,.menu,#mission').forEach(b=>b.onclick=()=>toast(b.innerText.replace(/\n/g,' · ')));
const joy=document.getElementById('joy');
function joyMove(clientX,clientY){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.36;let dx=clientX-cx,dy=clientY-cy,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max}joyX=dx/max;joyY=dy/max;joy.style.transform=`translate(${dx*.18}px,${dy*.18}px)`}
function joyStart(e){e.preventDefault();joyActive=true;const p=e.touches?e.touches[0]:e;joyMove(p.clientX,p.clientY)}
function joyEnd(){joyActive=false;joyX=joyY=0;joy.style.transform='translate(0,0)'}
joy.addEventListener('touchstart',joyStart,{passive:false});joy.addEventListener('touchmove',e=>{e.preventDefault();const p=e.touches[0];joyMove(p.clientX,p.clientY)},{passive:false});joy.addEventListener('touchend',joyEnd,{passive:false});joy.addEventListener('mousedown',joyStart);addEventListener('mousemove',e=>{if(joyActive)joyMove(e.clientX,e.clientY)});addEventListener('mouseup',joyEnd);
</script>
</body></html>
