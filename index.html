<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Đại Việt Chiến Ký V4</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06130d;font-family:Arial,sans-serif}body{display:flex;justify-content:center}#game{position:relative;width:100vw;height:100dvh;max-width:720px;overflow:hidden}#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;z-index:0}#cv{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none}.tap{position:absolute;z-index:5;border:0;background:transparent;box-shadow:none;color:transparent;border-radius:50%;padding:0}.sideTap{right:2%;width:16%;min-width:60px;height:6.5%;border-radius:18px}.menuTap{bottom:2%;height:8.5%;width:18%;border-radius:18px}.msg{position:absolute;z-index:10;left:50%;bottom:28%;transform:translateX(-50%);padding:9px 15px;border-radius:14px;background:#111d;color:#ffe5a0;border:1px solid #a87424;font-weight:800;opacity:0;transition:.2s;white-space:nowrap;pointer-events:none}.msg.show{opacity:1}
#joyTap{left:5%;bottom:13%;width:30%;height:24%}#attackTap{right:4%;bottom:13%;width:22%;height:18%}#skill1Tap{right:25%;bottom:14%;width:14%;height:15%}#skill2Tap{right:14%;bottom:14%;width:14%;height:15%}
#s1{top:14%}#s2{top:22%}#s3{top:30%}#s4{top:38%}#s5{top:46%}#s6{top:54%}#s7{top:62%}
#m1{left:3%}#m2{left:22%}#m3{left:41%}#m4{left:60%}#m5{right:3%}
</style></head><body><div id="game"><img id="bg" src="v4-game-bg.jpg"><canvas id="cv"></canvas>
<button id="joyTap" class="tap"></button><button id="attackTap" class="tap"></button><button id="skill1Tap" class="tap"></button><button id="skill2Tap" class="tap"></button>
<button id="s1" class="tap sideTap"></button><button id="s2" class="tap sideTap"></button><button id="s3" class="tap sideTap"></button><button id="s4" class="tap sideTap"></button><button id="s5" class="tap sideTap"></button><button id="s6" class="tap sideTap"></button><button id="s7" class="tap sideTap"></button>
<button id="m1" class="tap menuTap"></button><button id="m2" class="tap menuTap"></button><button id="m3" class="tap menuTap"></button><button id="m4" class="tap menuTap"></button><button id="m5" class="tap menuTap"></button><div id="msg" class="msg"></div></div>
<script>
const game=document.getElementById('game'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');let W,H,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=game.clientWidth;H=game.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const p={x:.49,y:.61,hp:120,max:120,speed:.00034,walk:0,flash:0};
// Vị trí 3 Sơn Tặc trên ảnh nền — dùng làm hitbox, không vẽ thêm sprite để tránh nhân đôi.
const enemies=[{x:.25,y:.56,hp:60,max:60,alive:true,flash:0},{x:.68,y:.53,hp:60,max:60,alive:true,flash:0},{x:.74,y:.70,hp:60,max:60,alive:true,flash:0}];
let joyX=0,joyY=0,joyOn=false,last=performance.now(),atk=0,sk=0,kills=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function toast(t){let m=document.getElementById('msg');m.textContent=t;m.classList.add('show');clearTimeout(window.mt);window.mt=setTimeout(()=>m.classList.remove('show'),1000)}
function xy(o){return{x:o.x*W,y:o.y*H}}
function drawPlayer(){const q=xy(p),s=Math.max(30,Math.min(43,W*.095)),b=Math.sin(p.walk)*2;ctx.save();ctx.translate(q.x,q.y+b);ctx.fillStyle='rgba(0,0,0,.38)';ctx.beginPath();ctx.ellipse(0,s*.68,s*.55,s*.18,0,0,7);ctx.fill();
ctx.strokeStyle='#16243a';ctx.lineWidth=s*.18;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-s*.16,s*.32);ctx.lineTo(-s*.25,s*.68);ctx.moveTo(s*.16,s*.32);ctx.lineTo(s*.25,s*.68);ctx.stroke();
ctx.fillStyle='#173b5c';ctx.beginPath();ctx.moveTo(-s*.4,-s*.02);ctx.lineTo(s*.4,-s*.02);ctx.lineTo(s*.32,s*.48);ctx.lineTo(-s*.32,s*.48);ctx.closePath();ctx.fill();ctx.fillStyle='#a05e2d';ctx.fillRect(-s*.42,s*.16,s*.84,s*.08);
ctx.fillStyle='#efbd88';ctx.beginPath();ctx.ellipse(0,-s*.34,s*.34,s*.39,0,0,7);ctx.fill();ctx.fillStyle='#17131a';ctx.beginPath();ctx.arc(-s*.2,-s*.54,s*.28,0,7);ctx.arc(s*.02,-s*.58,s*.34,Math.PI,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(s*.22,-s*.54);ctx.quadraticCurveTo(s*.72,-s*.72,s*.38,-s*.1);ctx.quadraticCurveTo(s*.18,-s*.32,s*.22,-s*.54);ctx.fill();
ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-s*.12,-s*.34,s*.035,0,7);ctx.arc(s*.12,-s*.34,s*.035,0,7);ctx.fill();ctx.strokeStyle='#e4edf5';ctx.lineWidth=s*.08;ctx.beginPath();ctx.moveTo(s*.27,s*.05);ctx.lineTo(s*.83,-s*.45);ctx.stroke();ctx.strokeStyle='#b98540';ctx.lineWidth=s*.05;ctx.beginPath();ctx.moveTo(s*.12,s*.02);ctx.lineTo(s*.33,s*.21);ctx.stroke();ctx.restore();
ctx.font='800 14px Arial';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.strokeText('ĐạiViệt',q.x,q.y-s*.98);ctx.fillStyle='#76ff62';ctx.fillText('ĐạiViệt',q.x,q.y-s*.98);}
function update(dt){if(joyOn){let m=Math.min(1,Math.hypot(joyX,joyY));p.x=clamp(p.x+joyX*p.speed*dt,.10,.88);p.y=clamp(p.y+joyY*p.speed*dt,.32,.84);if(m>.05)p.walk+=dt*.018}atk-=dt;sk-=dt;p.flash=Math.max(0,p.flash-dt);for(const e of enemies){if(!e.alive)continue;const d=Math.hypot(p.x-e.x,p.y-e.y);if(d<.055&&Math.random()<.006)p.hp=Math.max(0,p.hp-2);e.flash=Math.max(0,e.flash-dt)} }
function render(t){ctx.clearRect(0,0,W,H);drawPlayer();if(p.flash>0){ctx.fillStyle='rgba(255,30,20,.13)';ctx.fillRect(0,0,W,H)}for(const e of enemies){if(e.alive&&e.flash>0){const q=xy(e);ctx.fillStyle='rgba(255,60,30,.28)';ctx.beginPath();ctx.arc(q.x,q.y,38,0,7);ctx.fill()}}requestAnimationFrame(loop)}
function loop(t){let dt=Math.min(40,t-last);last=t;update(dt);render(t)}requestAnimationFrame(loop);
function attack(){if(atk>0)return;atk=320;let target=null,best=999;for(const e of enemies)if(e.alive){let d=Math.hypot(p.x-e.x,p.y-e.y);if(d<best){best=d;target=e}}if(target&&best<.20){target.hp-=30;target.flash=160;toast(target.hp<=0?'💥 Hạ Sơn Tặc!':'⚔️ Trúng quái');if(target.hp<=0){target.alive=false;kills++;toast(kills===3?'🎉 Hoàn thành nhiệm vụ!':'💰 +150 vàng')}}else toast('⚔️ Hãy tiến gần Sơn Tặc')}
function skill1(){if(sk>0)return;sk=850;let hit=0;for(const e of enemies)if(e.alive&&Math.hypot(p.x-e.x,p.y-e.y)<.27){e.hp-=45;e.flash=220;hit++;if(e.hp<=0){e.alive=false;kills++}}toast(hit?'🔥 Hỏa Kích ×'+hit:'🔥 Không có quái trong tầm')}
function joyMove(x,y){const r=document.getElementById('joyTap').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=x-cx,dy=y-cy,l=Math.hypot(dx,dy),m=Math.min(r.width*.35,l)||1;joyX=dx/m;joyY=dy/m}
const jt=document.getElementById('joyTap');jt.addEventListener('touchstart',e=>{e.preventDefault();joyOn=true;joyMove(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});jt.addEventListener('touchmove',e=>{e.preventDefault();joyMove(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});jt.addEventListener('touchend',()=>{joyOn=false;joyX=joyY=0},{passive:true});
document.getElementById('attackTap').onclick=attack;document.getElementById('skill1Tap').onclick=skill1;document.getElementById('skill2Tap').onclick=()=>toast('⚡ Lôi Kích!');
['s1','s2','s3','s4','s5','s6','s7','m1','m2','m3','m4','m5'].forEach(id=>document.getElementById(id).onclick=()=>toast('Đang mở tính năng...'));
</script></body></html>
