<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kiếm Hiệp Mobi - Bản 2.1</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#75b95c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
*{box-sizing:border-box}
#game{position:fixed;inset:0;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}
.box{background:rgba(10,15,22,.82);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:8px 10px;font-size:13px}
.hpbar{width:140px;height:8px;background:#333;border-radius:6px;margin-top:5px;overflow:hidden}
.hp{width:100%;height:100%;background:#e44}
.joystick{position:absolute;left:18px;bottom:25px;width:140px;height:140px;border-radius:70px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25)}
.stick{position:absolute;left:41px;top:41px;width:55px;height:55px;border-radius:50%;background:rgba(255,255,255,.38)}
.help{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;padding:5px 9px;border-radius:9px;font-size:10px;white-space:nowrap}
</style>
</head>
<body>
<div id="game">
<canvas id="canvas"></canvas>
<div class="hud">
<div class="box"><b>⚔️ Thiếu Hiệp</b><br>Cấp 8 · Võ Đang<div class="hpbar"><div class="hp"></div></div></div>
<div class="box">🗺️ Tân Thủ<br>📍 <span id="pos">1600,1200</span></div>
</div>
<div class="joystick" id="joy"><div class="stick" id="stick"></div></div>
<div class="help">Kéo joystick để di chuyển</div>
</div>
<script>
(function(){
"use strict";
var canvas=document.getElementById("canvas");
var ctx=canvas.getContext("2d");
var W=0,H=0,DPR=1;
var WORLD_WIDTH=3200,WORLD_HEIGHT=2400;
var player={x:1600,y:1200};
var camera={x:0,y:0};
var moveX=0,moveY=0,active=false,startX=0,startY=0;
var trees=[],monsters=[
{x:800,y:650,name:"Sơn Tặc"},
{x:1200,y:800,name:"Dã Lang"},
{x:2050,y:700,name:"Hắc Hùng"},
{x:2450,y:1250,name:"Sơn Tặc"},
{x:900,y:1750,name:"Dã Lang"},
{x:2200,y:1800,name:"Hắc Hùng"}
];
var i;
for(i=0;i<70;i++){trees.push({x:80+(i*179)%3000,y:100+(i*131)%2200});}
function resize(){
DPR=window.devicePixelRatio||1;if(DPR>2)DPR=2;
W=window.innerWidth;H=window.innerHeight;
canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
canvas.style.width=W+"px";canvas.style.height=H+"px";
ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize",resize);resize();
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
function tree(t){
ctx.fillStyle="#2f6735";ctx.beginPath();ctx.arc(t.x,t.y,22,0,Math.PI*2);ctx.fill();
ctx.fillStyle="#704c32";ctx.fillRect(t.x-5,t.y+15,10,32);
}
function monster(m){
var sx=m.x-camera.x,sy=m.y-camera.y;
if(sx<-80||sx>W+80||sy<-80||sy>H+80)return;
ctx.fillStyle="#27321f";ctx.fillRect(sx-22,sy-20,44,42);
ctx.font="24px sans-serif";ctx.textAlign="center";ctx.fillText("👹",sx,sy+7);
ctx.fillStyle="#fff";ctx.font="11px sans-serif";ctx.fillText(m.name,sx,sy+40);
}
function player(){
var x=player.x-camera.x,y=player.y-camera.y;
ctx.fillStyle="#182238";ctx.beginPath();ctx.arc(x,y,25,0,Math.PI*2);ctx.fill();
ctx.fillStyle="#e8c49b";ctx.beginPath();ctx.arc(x,y-10,14,0,Math.PI*2);ctx.fill();
ctx.fillStyle="#e7c34e";ctx.fillRect(x-15,y-29,30,7);
ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+12,y+3);ctx.lineTo(x+40,y-25);ctx.stroke();
ctx.fillStyle="#fff";ctx.font="bold 12px sans-serif";ctx.fillText("Bạn",x,y+44);
}
function drawWorld(){
ctx.clearRect(0,0,W,H);ctx.fillStyle="#75b95c";ctx.fillRect(0,0,W,H);
ctx.save();ctx.translate(-camera.x,-camera.y);
ctx.fillStyle="#b89b68";ctx.fillRect(0,1120,WORLD_WIDTH,120);ctx.fillRect(1540,0,120,WORLD_HEIGHT);
ctx.fillStyle="#4d9bc0";ctx.beginPath();
ctx.moveTo(300,0);ctx.bezierCurveTo(650,400,180,800,600,1200);
ctx.bezierCurveTo(850,1500,650,1900,900,2400);ctx.lineTo(1040,2400);
ctx.bezierCurveTo(820,1900,1080,1500,760,1100);ctx.bezierCurveTo(480,800,800,400,470,0);
ctx.closePath();ctx.fill();
for(i=0;i<trees.length;i++)tree(trees[i]);
ctx.fillStyle="#755038";ctx.fillRect(1350,500,500,230);
ctx.fillStyle="#ffe19a";ctx.font="bold 28px sans-serif";ctx.textAlign="center";ctx.fillText("THÔN TÂN THỦ",1600,625);
for(i=0;i<monsters.length;i++)monster(monsters[i]);
player();ctx.restore();
document.getElementById("pos").textContent=Math.round(player.x)+","+Math.round(player.y);
}
function update(){
var speed=3.8;
player.x=clamp(player.x+moveX*speed,30,WORLD_WIDTH-30);
player.y=clamp(player.y+moveY*speed,30,WORLD_HEIGHT-30);
camera.x=clamp(player.x-W/2,0,WORLD_WIDTH-W);
camera.y=clamp(player.y-H/2,0,WORLD_HEIGHT-H);
drawWorld();window.requestAnimationFrame(update);
}
var joy=document.getElementById("joy"),stick=document.getElementById("stick");
joy.addEventListener("touchstart",function(e){
if(!e.touches||!e.touches.length)return;
var t=e.touches[0];active=true;startX=t.clientX;startY=t.clientY;e.preventDefault();
},{passive:false});
joy.addEventListener("touchmove",function(e){
if(!active||!e.touches||!e.touches.length)return;
var t=e.touches[0],dx=t.clientX-startX,dy=t.clientY-startY,max=42;
var len=Math.sqrt(dx*dx+dy*dy);
if(len>max){dx=dx/len*max;dy=dy/len*max;}
moveX=dx/max;moveY=dy/max;
stick.style.transform="translate("+dx+"px,"+dy+"px)";
e.preventDefault();
},{passive:false});
function stop(){active=false;moveX=0;moveY=0;stick.style.transform="translate(0,0)";}
joy.addEventListener("touchend",stop);joy.addEventListener("touchcancel",stop);
drawWorld();window.requestAnimationFrame(update);
})();
</script>
</body>
</html>
